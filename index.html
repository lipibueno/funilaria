  };
}

/* --- foto --- */
function tirarFoto(ix){
  lerCampos();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    try{
      const blob = await comprimir(f);
      const it = rascunho.itens[ix];
      await guardarFotoLocal(it.ID, blob);
      it.FotoURL = '';                 // a planilha nunca recebe caminho nem conteúdo da foto
      delete it._novaFoto;
      guardarRascunho();
      telaEditor();
      aviso('Foto guardada somente neste aparelho');
    }catch(e){
      // falta de espaço é o motivo mais comum aqui, e merece um aviso próprio
      const semEspaco = e && (e.name === 'QuotaExceededError' || /quota|space|storage/i.test(e.message||''));
      aviso(semEspaco
        ? 'Sem espaço no aparelho para guardar a foto. Apague fotos de orçamentos antigos e tente de novo.'
        : 'Não consegui ler a foto', true);
    }
  };
  inp.click();
}
function comprimir(file, max){
  max = max || 1280;
  return new Promise((ok,falha)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const e = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? ok(b) : falha(new Error('Não foi possível comprimir a foto')), 'image/jpeg', .72);
    };
    img.onerror = e=>{ URL.revokeObjectURL(url); falha(e); };
    img.src = url;
  });
}

/* --- gravar tudo na planilha --- */
// Espelha a regra do servidor, só para avisar antes de tentar.
const travadoLocal = o => String(o.Travado)==='true' ||
  (o.Status==='Finalizado' && num(o.Saldo)<=0 && num(o.Total)>0);

async function salvarTudo(msg){
  if (ocupado) return false;
  lerCampos();
  const o = rascunho.orcamento;
  if (!String(o.ClienteNome).trim() && !String(o.Placa).trim()){ aviso('Informe ao menos o cliente ou a placa', true); return false; }
  const itens = rascunho.itens.filter(i => String(i.Descricao).trim());
  if (!itens.length){ aviso('Escolha ao menos um serviço da lista', true); return false; }

  let motivo = '';
  if (o.ID && travadoLocal(o)){
    if (!ehDono()){ aviso('Este orçamento está pago e fechado. Só o dono pode alterar.', true); return false; }
    motivo = await perguntar('Orçamento já pago',
      'Ele está fechado. A alteração fica registrada no histórico com o seu nome.',
      { rotulo:'Motivo da alteração', dica:'ex.: cliente pediu peça extra', obrigatorio:true, ok:'Alterar', perigo:true });
    if (!motivo){ aviso('Alteração cancelada', true); return false; }
  }

  const paraEnviar = () => itens.map(i=>({
    ID:i.ID, Descricao:i.Descricao, Qtd:num(i.Qtd)||1, Valor:num(i.Valor),
    // foto local não sai do aparelho; links antigos do Drive continuam legíveis
    FotoURL: temFotoLocal(i.ID) || String(i.FotoURL||'').startsWith('data:') ? '' : (i.FotoURL||'')
  }));

  // Sem internet: orçamento novo fica guardado; alteração de um que já existe, não.
  if (semRede()){
    if (o.ID){
      aviso('Sem internet. Para alterar um orçamento já salvo é preciso estar conectado.', true);
      return false;
    }
    enfileirar({ orcamento: Object.assign({}, o), itens: paraEnviar() });
    limparRascunho();
    aviso('Sem internet. Orçamento guardado e será enviado sozinho.');
    ir('painel');
    return false;   // não seguiu para pagamento/etapa: ainda não tem ID da planilha
  }

  ocupado = true;
  aviso('Salvando…');
  try{
    // Pagamentos não vão junto: eles têm ações próprias, que só somam lançamentos.
    const r = await chamar('salvarOrcamento', {
      orcamento: Object.assign({}, o, { Versao: o.Versao, ValorCobrado: num(o.ValorCobrado) || '' }),
      itens: paraEnviar(),
      motivo: motivo || ''
    });
    rascunho.orcamento = r.orcamento;
    rascunho.itens = r.itens;
    rascunho.pagamentos = r.pagamentos;
    limparRascunho();
    sincronizar(true);
    if (msg) aviso(msg);
    return true;
  }catch(e){
    // caiu a conexão no meio do salvamento de um orçamento novo: não perde o trabalho
    if (e.codigo === 'REDE' && !o.ID){
      enfileirar({ orcamento: Object.assign({}, o), itens: paraEnviar() });
      limparRascunho();
      aviso('Conexão caiu. Orçamento guardado e será enviado sozinho.');
      ir('painel');
      return false;
    }
    await tratar(e);
    return false;
  }
  finally{ ocupado = false; }
}

async function salvar(){ if (await salvarTudo('Orçamento salvo')) telaEditor(); }

async function avancar(prox){
  if (!(await salvarTudo())) return;
  try{
    const o = await chamar('mudarStatus', {
      id: rascunho.orcamento.ID, status: prox, versao: rascunho.orcamento.Versao });
    rascunho.orcamento = o;

/* --- pagamento: um toque para receber --- */
function abrirPag(){
  lerCampos(); pagAberto = true; telaEditor();
  const s = $('#secPag'); if (s) s.scrollIntoView({behavior:'smooth', block:'start'});
}
function escolherForma(f){ const v = $('#pgValor').value; pagForma = f; lerCampos(); telaEditor(); $('#pgValor').value = v; }

// O pagamento é lançado direto na planilha, em ação própria. Ele nunca mais
// depende de o app reenviar a lista inteira, então não há como sumir.
async function confirmarPag(){
  if (ocupado) return;
  const valor = num($('#pgValor').value);
  if (valor<=0){ aviso('Informe o valor recebido', true); return; }
  lerCampos();
  // salva antes o que estiver no formulário, para o servidor conferir o saldo certo
  if (!(await salvarTudo())) return;
  pagAberto = false;
  ocupado = true;
  try{
    const r = await chamar('registrarPagamento', {
      orcamentoId: rascunho.orcamento.ID, valor, forma: pagForma, data: hoje() });
    rascunho.orcamento = r.orcamento;
    rascunho.pagamentos.push(r.pagamento);
    sincronizar(true);
    const saldo = num(r.orcamento.Saldo);
    aviso(saldo<=0
      ? (r.orcamento.Status==='Finalizado' ? 'Pagamento recebido. Orçamento finalizado.' : 'Pagamento recebido. Totalmente pago.')
      : 'Pagamento recebido. Falta ' + moeda(saldo));
  }catch(e){ await tratar(e); }
  finally{ ocupado = false; telaEditor(); }
}

// Estorno em vez de exclusão: o valor original fica na planilha para sempre.
async function estornarPag(ix){
  const p = rascunho.pagamentos[ix];
  if (!p || ocupado) return;
  const naJanela = String(p.LancadoPor||'').toLowerCase() === (usuario ? usuario.email : '') &&
                   Date.now() - num(p.LancadoEmMs) <= 15*60*1000;
  if (!naJanela && !ehDono()){
    aviso('Passaram mais de 15 minutos. Só o dono pode estornar este pagamento.', true); return;
  }
  let motivo = '';
  if (!naJanela){
    motivo = await perguntar(`Estornar ${moeda(p.Valor)}`,
      'O lançamento original continua na planilha. O estorno entra como valor negativo.',
      { rotulo:'Motivo do estorno', dica:'ex.: pix caiu duplicado', obrigatorio:true, ok:'Estornar', perigo:true });
    if (!motivo){ aviso('Estorno cancelado', true); return; }
  } else if (!(await confirmar(`Estornar ${moeda(p.Valor)}?`,
      'Dá para corrigir sem motivo porque foi você que lançou, há menos de 15 minutos.', 'Estornar', true))) return;

  ocupado = true;
  try{
    const r = await chamar('estornarPagamento', { id: p.ID, motivo });
    rascunho.orcamento = r.orcamento;
    rascunho.pagamentos.push(r.estorno);
    sincronizar(true);
    aviso('Pagamento estornado');
  }catch(e){ await tratar(e); }
  finally{ ocupado = false; telaEditor(); }
}

/* ===================== PDF ===================== */

// Fotos novas vêm do armazenamento local. Links antigos do Drive ainda são
// aceitos para que orçamentos anteriores continuem gerando PDF.
const cacheFotos = {};

async function fotosDoOrcamento(itens){
  const saida = [];
  for (const it of itens){
    if (temFotoLocal(it.ID)){
      try{
        const blob = await buscarFotoLocal(it.ID);
        if (blob) saida.push({ desc:it.Descricao, dados:await blobParaDataURL(blob) });
      }catch(e){ console.warn('foto local não veio', it.ID, e.message); }
      continue;
    }
    const url = it.FotoURL;
    if (!url) continue;
    if (String(url).startsWith('data:')){            // foto recém-tirada, ainda no aparelho
      saida.push({ desc: it.Descricao, dados: url });
      continue;
    }
    const fid = driveId(url);
    if (!fid) continue;
    try{
      if (!cacheFotos[fid]){
        const r = await chamar('baixarFoto', { id: fid });
        cacheFotos[fid] = 'data:' + (r.mime || 'image/jpeg') + ';base64,' + r.base64;
      }
      saida.push({ desc: it.Descricao, dados: cacheFotos[fid] });
    }catch(e){
      // uma foto que falha não pode impedir o orçamento de sair
      console.warn('foto não veio', fid, e.message);
    }
  }
  return saida;
}

// Anexa as fotos ao fim do PDF, duas por linha.
function anexarFotos(d, fotos){
  if (!fotos.length) return;
  const M = 16, larg = 85, alt = 64;
  d.addPage();
  let y = 24;
  d.setFont('helvetica','bold'); d.setFontSize(12); d.setTextColor(20);
  d.text('Fotos do serviço', M, y);
  y += 8;

  fotos.forEach((f, i)=>{
    const col = i % 2;
    if (col === 0 && y + alt + 14 > 285){ d.addPage(); y = 24; }
    const x = M + col * (larg + 8);
    try{
      d.addImage(f.dados, 'JPEG', x, y, larg, alt, undefined, 'FAST');
    }catch(e){
      d.setDrawColor(210); d.rect(x, y, larg, alt);
    }
    if (f.desc){
      d.setFont('helvetica','normal'); d.setFontSize(8); d.setTextColor(110);
      d.text(d.splitTextToSize(String(f.desc), larg).slice(0,1), x, y + alt + 4);
    }
    if (col === 1) y += alt + 12;
  });
}

function montarPDF(){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:'mm', format:'a4'});
  const c = dados.config || {};
  const o = rascunho.orcamento;
  const itens = rascunho.itens.filter(i=>String(i.Descricao).trim());
  const t = totais();
  const M = 16;
  let y = 20;

  d.setFont('helvetica','bold'); d.setFontSize(16);
  d.text(String(c.oficina_nome||'Orçamento de serviços'), M, y);
  y += 6;
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  [c.oficina_endereco, c.oficina_telefone, c.oficina_doc].filter(Boolean).forEach(l=>{ d.text(String(l), M, y); y += 4.2; });
  d.setDrawColor(210); d.line(M, y+2, 194, y+2); y += 10;

  d.setTextColor(20); d.setFont('helvetica','bold'); d.setFontSize(12);
  d.text('Orçamento nº ' + (o.Numero||'—'), M, y);
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  d.text(dataBR(o.Data), 194, y, {align:'right'});
  y += 8;
  d.setTextColor(20); d.setFontSize(10);
  d.text('Cliente: ' + (o.ClienteNome||'—'), M, y); y += 5;
  const veic = [o.Modelo, o.Placa, o.Ano, o.Cor].filter(Boolean).join(' · ');
  if (veic){ d.text('Veículo: ' + veic, M, y); y += 5; }
  y += 4;

  d.setFillColor(20,23,26); d.rect(M, y-5, 178, 8, 'F');
  d.setTextColor(255); d.setFont('helvetica','bold'); d.setFontSize(9);
  d.text('Serviço', M+3, y); d.text('Qtd', 138, y, {align:'right'});
  d.text('Valor', 162, y, {align:'right'}); d.text('Total', 191, y, {align:'right'});
  y += 9;

  d.setTextColor(20); d.setFont('helvetica','normal'); d.setFontSize(10);
  itens.forEach(it=>{
    if (y > 258){ d.addPage(); y = 24; }
    const linhas = d.splitTextToSize(String(it.Descricao||''), 112);
    d.text(linhas, M+3, y);
    d.text(String(num(it.Qtd)||1), 138, y, {align:'right'});
    d.text(moeda(it.Valor), 162, y, {align:'right'});
    d.setFont('helvetica','bold'); d.text(moeda(num(it.Qtd)*num(it.Valor)), 191, y, {align:'right'}); d.setFont('helvetica','normal');
    y += 6 + (linhas.length-1)*5;
    d.setDrawColor(232); d.line(M, y-3, 194, y-3);
  });

  y += 4;
  if (y > 240){ d.addPage(); y = 24; }
  const linhaTot = (rot, val, forte)=>{
    d.setFont('helvetica', forte?'bold':'normal'); d.setFontSize(forte?13:10);
    d.text(rot, 150, y, {align:'right'}); d.text(moeda(val), 191, y, {align:'right'});
    y += forte ? 8 : 5.5;
  };
  linhaTot('Serviços', t.total, false);
  if (t.desconto > 0) linhaTot('Desconto', -t.desconto, false);
  if (t.pago > 0){
    if (t.desconto > 0) linhaTot('Valor cobrado', t.aCobrar, false);
    linhaTot('Recebido', t.pago, false);
    linhaTot(t.saldo>0?'Falta receber':'Saldo', t.saldo, true);
  } else {
    linhaTot('Total a pagar', t.aCobrar, true);
  }

  if (o.Obs){
    y += 4; d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(90);
    d.text(d.splitTextToSize(String(o.Obs), 178), M, y);
  }
  const dias = parseInt(c.validade_dias,10);
  if (dias){ d.setFontSize(9); d.setTextColor(120); d.text('Validade deste orçamento: ' + dias + ' dias.', M, 282); }
  return d;
}

async function gerarPDF(compartilhar){
  lerCampos();
  if (!window.jspdf){ aviso('Abra o app conectado à internet uma vez para preparar o PDF', true); return; }
  const o = rascunho.orcamento;
  const nome = `Orcamento-${o.Numero||'novo'}-${String(o.Placa||o.ClienteNome||'').replace(/\W+/g,'')}.pdf`;
  const doc = montarPDF();

  const comFoto = rascunho.itens.filter(temFoto).length;
  if (comFoto){
    aviso(`Buscando ${comFoto} foto(s) para o PDF…`);
    try{ anexarFotos(doc, await fotosDoOrcamento(rascunho.itens)); }
    catch(e){ aviso('Não consegui anexar as fotos, mas o orçamento vai sem elas.', true); }
  }

  if (!compartilhar){ doc.save(nome); return; }

  const blob = doc.output('blob');
  const arq = new File([blob], nome, {type:'application/pdf'});
  const texto = `Olá${o.ClienteNome?' '+String(o.ClienteNome).split(' ')[0]:''}! Segue o orçamento nº ${o.Numero||''} no valor de ${moeda(totais().aCobrar)}.`;

  if (navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({ files:[arq], title:nome, text:texto }); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  doc.save(nome);
  const tel = String(o.Telefone||'').replace(/\D/g,'');
  const numero = tel ? (tel.length<=11 ? '55'+tel : tel) : '';
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(texto+' (arquivo em anexo)'), '_blank');
  aviso('PDF baixado. Anexe na conversa que abriu.');
}

/* ===================== clientes ===================== */
const ultima = orcs => orcs.reduce((m,o)=> String(o.AtualizadoEm||o.Data||'')>m ? String(o.AtualizadoEm||o.Data||'') : m, '');

// junta orçamentos antigos (sem ClienteID) ao cliente certo pelo nome
function chaveCli(o){
  if (o.ClienteID) return 'id:' + o.ClienteID;
  const n = semAcento(String(o.ClienteNome||'').trim());
  const c = dados.clientes.find(c=> semAcento(String(c.Nome).trim())===n);
  return c ? 'id:' + c.ID : 'n:' + n;
}
function listaClientes(){
  const mapa = {};
  dados.clientes.forEach(c=>{ mapa['id:'+c.ID] = {chave:'id:'+c.ID, ID:c.ID, Nome:c.Nome, Telefone:c.Telefone, orcs:[]}; });
  dados.orcamentos.forEach(o=>{
    const k = chaveCli(o);
    if (!mapa[k]) mapa[k] = {chave:k, ID:o.ClienteID||'', Nome:o.ClienteNome||'Sem nome', Telefone:o.Telefone||'', orcs:[]};
    mapa[k].orcs.push(o);
  });
  return Object.values(mapa);
}
function veiculosDe(cli){
  const v = {};
  cli.orcs.slice().sort((a,b)=>String(a.Data).localeCompare(String(b.Data))).forEach(o=>{
    const p = String(o.Placa||'').toUpperCase().trim() || '—';
    if (!v[p]) v[p] = {Placa:String(o.Placa||'').toUpperCase(), Modelo:'', Ano:'', Cor:'', orcs:[]};
    ['Modelo','Ano','Cor'].forEach(c=>{ if (o[c]) v[p][c] = o[c]; });
    v[p].orcs.push(o);
  });
  return Object.values(v);
}
const emAberto = orcs => orcs.reduce((s,o)=> s + (o.Status!=='Orcamento' && String(o.Arquivado)!=='true' ? Math.max(0,num(o.Saldo)) : 0), 0);

function mostrarVeiculos(){
  const box = $('#veicChips'); if (!box) return;
  const o = rascunho.orcamento;
  const n = semAcento(String(o.ClienteNome||'').trim());
  const cli = n && listaClientes().find(c=> (o.ClienteID && String(c.ID)===String(o.ClienteID)) || semAcento(String(c.Nome).trim())===n);
  const vs = cli ? veiculosDe(cli).filter(v=>v.Placa) : [];
  if (!vs.length){ box.innerHTML=''; return; }
  box.innerHTML = `<label>Carros deste cliente</label><div class="formas">` +
    vs.map((v,k)=>`<button class="chip" data-k="${k}">${esc(v.Placa)}${v.Modelo?' · '+esc(v.Modelo):''}</button>`).join('') + `</div>`;
  box.querySelectorAll('button').forEach(b=> b.onclick = ()=>{
    const v = vs[+b.dataset.k];
    $('#fPlaca').value=v.Placa||''; $('#fModelo').value=v.Modelo||''; $('#fAno').value=v.Ano||''; $('#fCor').value=v.Cor||'';
    lerCampos(); aviso('Carro preenchido');
  });
}

function telaClientes(){
  cabecalho('Clientes','carros e histórico de cada um');
  const t = semAcento(buscaCli.trim());
  const lista = listaClientes()
    .filter(c=> !t || semAcento(c.Nome).includes(t) || String(c.Telefone).replace(/\D/g,'').includes(t.replace(/\D/g,'')||'#') ||
                 c.orcs.some(o=> semAcento(o.Placa).includes(t)))

  lista.forEach(c=>{
    const nv = veiculosDe(c).filter(v=>v.Placa).length;

    h += `<button class="card" onclick="ir('cliente','${escJs(c.chave)}')">

    </button>`;
  });
  tela.innerHTML = h + '</div>';
  const b = $('#fBusca');
  b.oninput = ()=>{ buscaCli = b.value; const pos=b.selectionStart; telaClientes(); const n=$('#fBusca'); n.focus(); n.setSelectionRange(pos,pos); };

      h += `<button class="orcrow" onclick="abrir('${escJs(o.ID)}')">
        <div><span class="pl" style="font-weight:700">nº ${esc(o.Numero)}</span> <span class="md">${dataBR(o.Data)}${String(o.Arquivado)==='true'?' · arquivado':''}</span></div>
        <div class="vl">${moeda(o.Total)}</div>

        <div class="st">${num(o.Total)>0&&num(o.Saldo)<=0?'<span class="pago">Pago</span>':num(o.Pago)>0?`<span class="dev">falta ${moeda(o.Saldo)}</span>`:''}</div>
      </button>`;
    });
    h += `</div>`;
  });

/* ===================== caixa ===================== */
function intervalo(){
  const d = new Date();
  if (periodo==='hoje') return [hoje(), hoje(), 'Hoje'];
  if (periodo==='7d'){ const i=new Date(d); i.setDate(d.getDate()-6); return [ymd(i), hoje(), 'Últimos 7 dias']; }
  if (periodo==='mes') return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), hoje(), 'Este mês'];
  if (periodo==='mesant'){
    const i = new Date(d.getFullYear(), d.getMonth()-1, 1), f = new Date(d.getFullYear(), d.getMonth(), 0);
    return [ymd(i), ymd(f), i.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})];
  }
  return [pIni||hoje(), pFim||hoje(), 'Período escolhido'];
}
function mudarPeriodo(p){ periodo = p; telaCaixa(); }

function telaCaixa(){
  const [ini, fim, nome] = intervalo();
  cabecalho('Caixa', nome.charAt(0).toUpperCase()+nome.slice(1));
  const orcPorId = {}; dados.orcamentos.forEach(o=> orcPorId[o.ID]=o);
  const pags = dados.pagamentos
    .filter(p=>{ const d=String(p.Data).slice(0,10); return d>=ini && d<=fim; })
    .sort((a,b)=> String(b.Data).localeCompare(String(a.Data)));
  const total = pags.reduce((s,p)=>s+num(p.Valor),0);
  const porForma = {};
  pags.forEach(p=>{ porForma[p.Forma||'Outro'] = (porForma[p.Forma||'Outro']||0) + num(p.Valor); });

  const ativos = dados.orcamentos.filter(o=>String(o.Arquivado)!=='true' && o.Status!=='Orcamento' && num(o.Saldo)>0);
  const entregues = ativos.filter(o=>o.Status==='Aguardando pagamento').reduce((s,o)=>s+num(o.Saldo),0);
  const emServico = ativos.filter(o=>o.Status!=='Aguardando pagamento').reduce((s,o)=>s+num(o.Saldo),0);

  const ops = [['hoje','Hoje'],['7d','7 dias'],['mes','Este mês'],['mesant','Mês passado'],['outro','Escolher']];
  let h = `<div class="chips">${ops.map(([k,r])=>`<button class="chip" aria-pressed="${periodo===k}" onclick="mudarPeriodo('${k}')">${r}</button>`).join('')}</div><div class="wrap">`;
  if (periodo==='outro'){
    h += `<div class="periodo">
      <div><label for="pIni" style="margin-top:0">De</label><input id="pIni" type="date" value="${ini}"></div>
      <div><label for="pFim" style="margin-top:0">Até</label><input id="pFim" type="date" value="${fim}"></div></div>`;
  }
  h += `<div class="recebido"><span>Recebido</span><div class="v">${moeda(total)}</div>
    ${Object.keys(porForma).map(f=>`<div class="l"><span>${FORMA_ROT[f]||f}</span><b>${moeda(porForma[f])}</b></div>`).join('')}
    ${!pags.length?'<div class="l"><span>Nenhum recebimento no período</span></div>':''}
  </div>
  <div class="tot-box">
    <div class="l"><span>A receber de carros já entregues</span><b class="${entregues>0?'saldo-dev':''}">${moeda(entregues)}</b></div>
    <div class="l"><span>A receber de serviços em andamento</span><b>${moeda(emServico)}</b></div>
  </div>
  <div class="secao">Recebimentos (${pags.length})</div>`;
  pags.forEach(p=>{
    const o = orcPorId[p.OrcamentoID] || {};
    h += `<button class="pgrow" onclick="${o.ID?`abrir('${escJs(o.ID)}')`:''}">
      <b>${esc(o.ClienteNome||'Orçamento removido')}</b><span class="vl">${moeda(p.Valor)}</span>
      <small>${dataBR(p.Data)} · ${esc(o.Placa||'')} ${o.Numero?'· nº '+esc(o.Numero):''}</small><small style="text-align:right">${FORMA_ROT[p.Forma]||p.Forma}</small>
    </button>`;
  });
  tela.innerHTML = h + '</div>';
  if (periodo==='outro'){
    $('#pIni').onchange = e=>{ pIni = e.target.value; telaCaixa(); };
    $('#pFim').onchange = e=>{ pFim = e.target.value; telaCaixa(); };
  }
}

  const email = ($('#uEmail').value||'').trim().toLowerCase();

  if (!ativo && !(await confirmar('Bloquear acesso', email + ' deixa de conseguir entrar no app.', 'Bloquear', true))) return;

// Testa exatamente a URL que está gravada no app, sem depender de login.
// Assim não há risco de conferir uma implantação e o app usar outra.
async function testarConexao(){
  const url = ($('#fApi').value || '').trim();
  const box = $('#diag');
  if (!url){ box.innerHTML = `<div class="aviso" style="border-color:var(--debt);color:var(--debt)">Cole o endereço da API primeiro.</div>`; return; }
  box.innerHTML = `<div class="aviso">Testando…</div>`;

  let d;
  try{
    const r = await fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + 'diag=1');
    d = await r.json();
  }catch(e){
    box.innerHTML = `<div class="aviso" style="border-color:var(--debt);color:var(--debt)">
      <b>Não consegui falar com esse endereço.</b><br>
      Confira se ele termina em <b>/exec</b> e se a implantação está como "Qualquer pessoa".</div>`;
    return;
  }

  if (d.versao === undefined){
    box.innerHTML = `<div class="aviso" style="border-color:var(--debt);color:var(--debt)">
      <b>Respondeu, mas não é a versão nova.</b><br>
      Publique de novo: Implantar › Gerenciar implantações › lápis › Nova versão.</div>`;
    return;
  }

  const linha = (rot, valor, bom) =>
    `<div class="l"><span>${rot}</span><b style="color:${bom?'#7FD6A8':'#FFB4AC'}">${bom?'ok':'falta'}</b></div>`;
  const externa = String(d.chamadaExterna||'').indexOf('LIBERADA') === 0;
  const comoDono = String(d.executandoComo||'').indexOf('correto') > 0;
  const planilha = d.planilha === 'acessivel';

  let h = `<div class="tot-box" style="margin-top:10px">
    ${linha('Versão publicada', d.versao, String(d.versao)==='7')}
    ${linha('CLIENT_ID no servidor', '', !!d.clientIdPreenchido)}
    ${linha('Permissão de validar login', '', externa)}
    ${linha('Executando como dono', '', comoDono)}
    ${linha('Acesso à planilha', '', planilha)}
  </div>`;

  if (d.ok){
    h += `<div class="quitado">✓ Tudo certo. Pode entrar.</div>`;
  } else {
    const oque = [];
    if (String(d.versao)!=='7') oque.push('A API está rodando uma versão antiga. Cole o <b>Codigo.gs</b> novo e publique <b>Nova versão</b>.');
    if (!d.clientIdPreenchido) oque.push('O <b>CLIENT_ID</b> não foi preenchido no Codigo.gs.');
    if (!externa) oque.push('No editor do Apps Script, rode a função <b>autorizar</b>, aceite as permissões e publique <b>Nova versão</b>.');
    if (!comoDono) oque.push('Na implantação, <b>Executar como</b> precisa ser <b>Eu</b>, não "Usuário que acessa o app".');
    if (!planilha) oque.push('O script não está conseguindo abrir a planilha.');
    h += `<div class="aviso" style="border-color:var(--debt);margin-top:10px"><b>Falta resolver:</b><ul style="margin:6px 0 0 18px;padding:0">${
      oque.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join('')}</ul></div>`;
  }
  box.innerHTML = h;
}

async function salvarApi(){
  API = $('#fApi').value.trim();
  localStorage.setItem('api_url', API);
  await sincronizar();
  if (usuario) ir('painel'); else { telaAtual='login'; telaLogin(); }
}

/* ===================== início ===================== */
lerCache();

// Sessão por código fica guardada: o app abre já logado, e só sai quando a pessoa pedir.
const sessaoSalva = localStorage.getItem('sessao');
if (sessaoSalva){
  token = sessaoSalva;
  tokenExp = Date.now() + 365*86400000;
  telaAtual = 'painel';
  tela.innerHTML = '<div class="carregando">Entrando…</div>';
  entrar();
} else {
  // sem sessão, nada é mostrado antes do login — nem a partir da cópia local.
  // O login por código funciona mesmo sem o Google configurado.
  dados.orcamentos = dados.orcamentos || [];
  telaAtual = 'login';
  telaLogin();
  if (CLIENT_ID){
    // o script do Google pode chegar depois; ao chegar, redesenha o botão —
    // mas só se ainda estivermos no login, senão apaga o painel de quem já entrou
    const esperarGIS = setInterval(()=>{
      if (!iniciarGIS()) return;
      clearInterval(esperarGIS);
      if (!usuario && telaAtual==='login' && etapaLogin==='email') telaLogin();
    }, 300);
    setTimeout(()=>clearInterval(esperarGIS), 15000);
  }
}
pintarAvisoFila();
// Atualização: procura versão nova ao abrir e sempre que o app volta para a frente.
// Quando a nova assume, recarrega uma vez — senão a pessoa fica vendo a versão velha
// sem saber, que foi exatamente o que aconteceu ao publicar a v6.
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', ()=>{
      if (!document.hidden) reg.update().catch(()=>{});
    });
  }).catch(()=>{});

  // precisa ser lido AGORA: dentro do controllerchange o controlador já é o novo
  const tinhaControlador = !!navigator.serviceWorker.controller;
  let recarregando = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    // na primeira instalação não havia controlador: aí não recarrega
    if (recarregando || !tinhaControlador) return;
    recarregando = true;
    location.reload();
  });
}
