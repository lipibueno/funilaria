<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Orçamentos — Funilaria</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#14171A; --steel:#6B7480; --primer:#E9EBEE; --paper:#fff;
  --line:#D5DAE0; --tape:#F5C518; --ok:#1E8E5A; --debt:#C8372D;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--primer);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* topo */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;
}
header h1{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0;flex:1}
header .sub{font-size:12px;font-weight:500;color:#9AA3AE;display:block;letter-spacing:0}
.iconbtn{color:#fff;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:#2A2F36}

main{padding:16px 0 96px}
.wrap{padding:0 16px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 84%;max-width:340px;scroll-snap-align:center}
.colhead{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px}
.colhead b{font-size:14px;font-weight:800}
.colhead span{font-size:12px;color:var(--steel);font-weight:600}
.colhead .bar{height:3px;border-radius:2px;background:var(--ink);flex:1}
.col[data-s="Aguardando pagamento"] .bar{background:var(--debt)}
.col[data-s="Finalizado"] .bar{background:var(--ok)}
.col[data-s="Em execucao"] .bar{background:var(--tape)}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:10px;display:block;width:100%;text-align:left;
}
.card:active{border-color:var(--ink)}
.card .placa{font-size:19px;font-weight:800;letter-spacing:1px}
.card .cli{font-size:13px;color:var(--steel);margin-top:1px}
.card .rod{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.card .tot{font-size:17px;font-weight:800}
.card .dev{font-size:12px;font-weight:600;color:var(--debt)}
.card .num{font-size:11px;color:var(--steel);font-weight:600}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;color:var(--steel);font-size:13px}

/* formulário */
label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:14px 0 5px}
input,select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,23,26,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* itens */
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.item .top{display:flex;gap:8px;align-items:center}
.item .top input{border:none;padding:4px 0;font-weight:600;background:none}
.item .top input:focus{box-shadow:none}
.item .lin{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;margin-top:8px}
.item .lin input{padding:9px;text-align:right}
.del{width:38px;height:38px;border-radius:var(--r);color:var(--steel);font-size:20px;display:grid;place-items:center}
.foto{margin-top:10px;display:flex;gap:10px;align-items:center}
.foto img{width:64px;height:64px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.fotobtn{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;font-weight:600;color:var(--steel);background:var(--paper)}

/* sugestões */
.sug{position:relative}
.sugbox{
  position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--paper);
  border:1px solid var(--ink);border-radius:var(--r);margin-top:4px;overflow:hidden;
  max-height:220px;overflow-y:auto;box-shadow:0 10px 24px rgba(20,23,26,.14)
}
.sugbox button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.sugbox button:last-child{border-bottom:none}
.sugbox button:active{background:var(--primer)}
.sugbox b{font-weight:600}
.sugbox span{color:var(--steel);font-size:13px;white-space:nowrap}

/* totais */
.tot-box{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-top:16px}
.tot-box .l{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#B9C0C8}
.tot-box .l b{color:#fff;font-weight:600}
.tot-box .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #2F353C;margin-top:8px;padding-top:10px}
.tot-box .big span{font-size:13px;color:#B9C0C8}
.tot-box .big b{font-size:24px;font-weight:800}
.saldo-dev{color:#FFB4AC!important}
.saldo-ok{color:#7FD6A8!important}

/* botões */
.btn{display:block;width:100%;padding:15px;border-radius:var(--r);font-weight:700;text-align:center;background:var(--ink);color:#fff;margin-top:10px}
.btn:active{opacity:.85}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.tape{background:var(--tape);color:var(--ink)}
.btn.ghost{background:none;color:var(--debt);font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acoes .btn{margin-top:0}

/* status atual */
.statusbar{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.statusbar b{font-size:14px;flex:1}
.statusbar small{color:var(--steel);font-size:12px}

/* lista serviços */
.srv{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.srv .d{flex:1;font-weight:600;font-size:15px}
.srv .c{font-size:12px;color:var(--steel)}
.srv .v{font-weight:700}

/* barra inferior */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{padding:10px 4px 12px;font-size:11px;font-weight:600;color:var(--steel);display:grid;gap:3px;justify-items:center}
nav button .i{font-size:20px;line-height:1}
nav button[aria-current="true"]{color:var(--ink)}
nav button[aria-current="true"] .i{transform:translateY(-1px)}

/* avisos */
.toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:var(--r);z-index:60;font-size:14px;font-weight:500}
.toast.err{background:var(--debt)}
.hide{display:none!important}
.carregando{text-align:center;color:var(--steel);padding:40px 16px;font-size:14px}
.aviso{background:#FFF6D6;border:1px solid var(--tape);border-radius:var(--r);padding:12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sobe .18s ease-out}}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}

/* v2: filtros do painel */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip span{opacity:.6;margin-left:4px}
.lista{padding:0 16px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--primer);color:var(--ink);white-space:nowrap}
.pill.s-Aprovado{background:#DCE6F5}
.pill.s-Em{background:#FCEBA6}
.pill.s-Pronto{background:#D9DEE4}
.pill.s-Aguardando{background:#F7D3CF;color:#8E2219}
.pill.s-Finalizado{background:#CFEBDD;color:#145C3B}
.card .linha1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .pago{font-size:12px;font-weight:700;color:var(--ok)}

/* v2: etapas */
.etapas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 6px}
.etapa{height:6px;border-radius:3px;background:var(--line)}
.etapa.feito{background:var(--ink)}
.etapa.atual{background:var(--tape)}
.etapa.espera{background:var(--debt)}
.etapas-rot{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10.5px;color:var(--steel);font-weight:600;margin-bottom:12px}
.etapas-rot .atual{color:var(--ink)}
.proximo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.proximo p{margin:0 0 2px;font-size:13px;color:var(--steel)}
.proximo .btn{margin-top:8px}
.voltar-etapa{display:block;margin:8px auto 0;font-size:13px;color:var(--steel);text-decoration:underline;padding:6px}

/* v2: serviço travado na lista */
.item .top input::placeholder{color:#9AA3AE;font-weight:500}
.sugbox .novo{color:var(--ink);font-weight:700;background:#FFF6D6}
.fotogrande{display:block;width:100%;height:190px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);margin-top:10px;background:var(--primer)}

/* v3: grupos por cliente */
.grupo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-bottom:1px solid var(--line);background:#F7F8F9}
.grupo-cab b{font-size:16px;font-weight:800}
.grupo-cab small{display:block;font-size:12px;color:var(--steel);font-weight:500}
.grupo-cab .aberto{font-size:13px;font-weight:700;color:var(--debt);white-space:nowrap}
.orcrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.orcrow:last-child{border-bottom:none}
.orcrow:active{background:var(--primer)}
.orcrow .pl{font-weight:800;letter-spacing:.5px}
.orcrow .md{font-size:12px;color:var(--steel)}
.orcrow .vl{text-align:right;font-weight:700}
.orcrow .st{text-align:right}
.busca{margin-bottom:12px}
.veic{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.veic-cab{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.veic-cab b{font-size:17px;font-weight:800;letter-spacing:.5px}
.veic-cab small{display:block;color:var(--steel);font-size:12px}
.minibtn{font-size:13px;font-weight:700;padding:8px 12px;border-radius:var(--r);background:var(--tape);white-space:nowrap}

/* v3: caixa */
.recebido{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-top:4px}
.recebido span{font-size:13px;color:#B9C0C8}
.recebido .v{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
.recebido .l{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#D5DAE0}
.periodo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pgrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.pgrow b{font-weight:700}
.pgrow small{color:var(--steel);font-size:12px}
.pgrow .vl{text-align:right;font-weight:800;color:var(--ok)}

/* v2: pagamento */
.pgbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px}
.pglin{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pglin:last-of-type{border-bottom:none}
.pglin small{color:var(--steel)}
.formas{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quitado{display:flex;align-items:center;gap:10px;background:#E4F5EC;border:1px solid #9FD8BA;color:#145C3B;border-radius:var(--r);padding:12px;font-weight:700;margin-top:8px}
.secao{font-size:15px;font-weight:800;margin:22px 0 4px}
</style>
</head>
<body>

<header>
  <button class="iconbtn hide" id="btVoltar" aria-label="Voltar">←</button>
  <h1 id="titulo">Painel<span class="sub" id="subtitulo">orçamentos em andamento</span></h1>
  <button class="iconbtn" id="btSync" aria-label="Atualizar">⟳</button>
</header>

<main id="tela"><div class="carregando">Carregando…</div></main>

<nav>
  <button data-ir="painel" aria-current="true"><span class="i">▦</span>Painel</button>
  <button data-ir="clientes"><span class="i">👤</span>Clientes</button>
  <button data-ir="novo"><span class="i">＋</span>Novo</button>
  <button data-ir="caixa"><span class="i">$</span>Caixa</button>
  <button data-ir="mais"><span class="i">☰</span>Mais</button>
</nav>

<script>
/* ===================== estado ===================== */
const STATUS = ['Orcamento','Aprovado','Em execucao','Pronto p/ entrega','Aguardando pagamento','Finalizado'];
const ROTULO = {
  'Orcamento':'Orçamento','Aprovado':'Aprovado','Em execucao':'Em execução',
  'Pronto p/ entrega':'Pronto p/ entrega','Aguardando pagamento':'Aguardando pagamento','Finalizado':'Finalizado'
};
const ETAPAS = [['Orcamento','Orçamento'],['Aprovado','Aprovado'],['Em execucao','Execução'],['Pronto p/ entrega','Pronto'],['Finalizado','Entregue']];
const ANTERIOR = {'Aprovado':'Orcamento','Em execucao':'Aprovado','Pronto p/ entrega':'Em execucao','Aguardando pagamento':'Pronto p/ entrega','Finalizado':'Pronto p/ entrega'};
const FORMAS = ['Pix','Dinheiro','Cartao','Transferencia'];
const FORMA_ROT = {Pix:'Pix',Dinheiro:'Dinheiro',Cartao:'Cartão',Transferencia:'Transferência'};

let API = localStorage.getItem('api_url') || '';
let dados = { config:{}, clientes:[], servicos:[], orcamentos:[], itens:[], pagamentos:[] };
let rascunho = null;
let telaAtual = 'painel';
let filtro = 'Todos';
let pagAberto = false;
let pagForma = 'Pix';
let ocupado = false;
let clienteAtual = '';
let buscaCli = '';
let periodo = 'mes';
let pIni = '', pFim = '';

const $ = s => document.querySelector(s);
const tela = $('#tela');

/* ===================== utilidades ===================== */
const num = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
};
const moeda = v => num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje = () => ymd(new Date());
const dataBR = d => { const p=String(d||'').slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : (d||''); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = p => p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*1000).toString(36).toUpperCase();
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pillClasse = s => 's-' + String(s||'').split(' ')[0];

// Links do Drive viram miniatura que o navegador consegue exibir
function driveId(url){
  const m = String(url||'').match(/[?&]id=([\w-]+)/) || String(url||'').match(/\/d\/([\w-]+)/);
  return m ? m[1] : '';
}
function fotoSrc(url){
  if (!url || String(url).startsWith('data:')) return url;
  const i = driveId(url);
  return i ? `https://drive.google.com/thumbnail?id=${i}&sz=w1000` : url;
}
function fotoAbrir(url){
  if (!url || String(url).startsWith('data:')) return;
  const i = driveId(url);
  window.open(i ? `https://drive.google.com/file/d/${i}/view` : url, '_blank');
}
function fotoErro(img){
  const i = driveId(img.dataset.url);
  if (i && !img.dataset.tentou){ img.dataset.tentou = 1; img.src = `https://lh3.googleusercontent.com/d/${i}=w1000`; }
}

function aviso(msg, erro){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), erro ? 5000 : 2800);
}

async function chamar(action, corpo){
  if (!API) throw new Error('Configure o endereço da API em Ajustes');
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, corpo||{}))
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Falha na API');
  return j.data;
}

function salvarCache(){ localStorage.setItem('cache', JSON.stringify(dados)); }
function lerCache(){
  try { const c = JSON.parse(localStorage.getItem('cache')); if (c && c.orcamentos) dados = c; } catch(e){}
}

async function sincronizar(silencioso){
  if (!API) return;
  try{
    dados = await chamar('carregar', { incluirArquivados:true });
    salvarCache();
    if (!silencioso){ aviso('Dados atualizados'); render(); }
  }catch(e){
    if (!silencioso) aviso(e.message, true);
  }
}

/* ===================== navegação ===================== */
const ABA = {painel:'painel',clientes:'clientes',cliente:'clientes',novo:'novo',caixa:'caixa',mais:'mais',servicos:'mais',ajustes:'mais',editor:''};
function ir(t, arg){
  telaAtual = t;
  pagAberto = false;
  const aba = ABA[t]===undefined ? '' : ABA[t];
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.ir===aba ? 'true':'false'));
  $('#btVoltar').classList.toggle('hide', t==='painel');
  if (t==='novo'){ rascunho = novoRascunho(arg); telaAtual='editor'; }
  if (t==='editor' && arg) rascunho = arg;
  if (t==='cliente' && arg) clienteAtual = arg;
  render();
  window.scrollTo(0,0);
}
$('#btVoltar').onclick = ()=> ir('painel');
$('#btSync').onclick = async ()=>{ await sincronizar(); };
document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> ir(b.dataset.ir));

function cabecalho(t, s){ $('#titulo').childNodes[0].nodeValue = t; $('#subtitulo').textContent = s; }

function render(){
  if (telaAtual==='painel') telaPainel();
  else if (telaAtual==='editor') telaEditor();
  else if (telaAtual==='servicos') telaServicos();
  else if (telaAtual==='clientes') telaClientes();
  else if (telaAtual==='cliente') telaCliente();
  else if (telaAtual==='caixa') telaCaixa();
  else if (telaAtual==='mais') telaMais();
  else if (telaAtual==='ajustes') telaAjustes();
}

/* ===================== painel ===================== */
function telaPainel(){
  cabecalho('Painel','orçamentos em andamento');
  const ativos = dados.orcamentos.filter(o => String(o.Arquivado)!=='true');

  if (!API){
    tela.innerHTML = `<div class="wrap">
      <div class="aviso">Antes de usar, informe o endereço da API em <b>Ajustes</b>. É o link que o Apps Script gerou ao publicar.</div>
      <button class="btn" onclick="ir('ajustes')">Abrir ajustes</button></div>`;
    return;
  }
  if (!ativos.length){
    tela.innerHTML = `<div class="wrap"><div class="vazio">Nenhum orçamento em andamento.<br>Toque em <b>Novo</b> para criar o primeiro.</div></div>`;
    return;
  }

  const conta = s => ativos.filter(o=>o.Status===s).length;
  if (filtro!=='Todos' && !conta(filtro)) filtro = 'Todos';
  let h = '<div class="chips">';
  h += `<button class="chip" aria-pressed="${filtro==='Todos'}" onclick="filtrar('Todos')">Todos<span>${ativos.length}</span></button>`;
  STATUS.forEach(s=>{
    const n = conta(s); if (!n) return;
    h += `<button class="chip" aria-pressed="${filtro===s}" onclick="filtrar('${s}')">${ROTULO[s]}<span>${n}</span></button>`;
  });
  h += '</div><div class="lista">';

  const lista = filtro==='Todos' ? ativos : ativos.filter(o=>o.Status===filtro);
  const grupos = {};
  lista.forEach(o=>{
    const k = chaveCli(o);
    (grupos[k] = grupos[k] || {chave:k, nome:o.ClienteNome||'Sem nome', orcs:[]}).orcs.push(o);
  });
  Object.values(grupos)
    .sort((x,y)=> ultima(y.orcs).localeCompare(ultima(x.orcs)))
    .forEach(g=>{
      const aberto = g.orcs.reduce((s,o)=> s + (o.Status!=='Orcamento' ? Math.max(0,num(o.Saldo)) : 0), 0);
      const placas = new Set(g.orcs.map(o=>String(o.Placa||'').toUpperCase())).size;
      h += `<div class="grupo">
        <button class="grupo-cab" onclick="ir('cliente','${esc(g.chave)}')">
          <div><b>${esc(g.nome)}</b><small>${placas} ${placas>1?'carros':'carro'} · ${g.orcs.length} ${g.orcs.length>1?'orçamentos':'orçamento'}</small></div>
          ${aberto>0?`<span class="aberto">falta ${moeda(aberto)}</span>`:''}
        </button>`;
      g.orcs.sort((x,y)=>String(y.AtualizadoEm||'').localeCompare(String(x.AtualizadoEm||''))).forEach(o=>{
        h += `<button class="orcrow" onclick="abrir('${o.ID}')">
          <div><span class="pl">${esc(o.Placa||'sem placa')}</span> <span class="md">${esc(o.Modelo||'')} · nº ${esc(o.Numero)}</span></div>
          <div class="vl">${moeda(o.Total)}</div>
          <div><span class="pill ${pillClasse(o.Status)}">${ROTULO[o.Status]||o.Status}</span></div>
          <div class="st">${num(o.Total)>0&&num(o.Saldo)<=0?'<span class="pago">Pago</span>':num(o.Pago)>0?`<span class="dev">falta ${moeda(o.Saldo)}</span>`:''}</div>
        </button>`;
      });
      h += `</div>`;
    });
  tela.innerHTML = h + '</div>';
}
function filtrar(s){ filtro = s; telaPainel(); }

function abrir(oid){

    orcamento: Object.assign({}, o),
    itens: dados.itens.filter(i=>String(i.OrcamentoID)===String(oid))
             .sort((a,b)=>num(a.Ordem)-num(b.Ordem)).map(i=>Object.assign({},i)),
    pagamentos: dados.pagamentos.filter(p=>String(p.OrcamentoID)===String(oid)).map(p=>Object.assign({},p))
  });
}

function novoRascunho(pref){
  return {
    orcamento:Object.assign({ ID:'', Numero:'', Data:hoje(), ClienteID:'', ClienteNome:'', Telefone:'', Placa:'', Modelo:'', Ano:'', Cor:'', Status:'Orcamento', Obs:'', Arquivado:false }, pref||{}),

  };

/* ===================== editor ===================== */
function totais(){
  const total = rascunho.itens.reduce((s,i)=> s + num(i.Qtd)*num(i.Valor), 0);
  const pago  = rascunho.pagamentos.reduce((s,p)=> s + num(p.Valor), 0);
  return { total, pago, saldo: total - pago };
}

function blocoEtapas(o, t){
  const espera = o.Status==='Aguardando pagamento';
  const atual = espera ? 4 : ETAPAS.findIndex(e=>e[0]===o.Status);
  let h = '<div class="etapas">';
  ETAPAS.forEach((e,i)=>{
    const cl = i<atual ? 'feito' : i===atual ? (espera ? 'espera' : (o.Status==='Finalizado' ? 'feito' : 'atual')) : '';
    h += `<i class="etapa ${cl}"></i>`;
  });
  h += '</div><div class="etapas-rot">';
  ETAPAS.forEach((e,i)=> h += `<span class="${i===atual?'atual':''}">${e[1]}</span>`);
  h += '</div>';

  let titulo = '', btn = '';
  if (o.Status==='Orcamento'){ titulo='Aguardando o cliente aprovar'; btn=`<button class="btn" onclick="avancar('Aprovado')">Cliente aprovou</button>`; }
  else if (o.Status==='Aprovado'){ titulo='Aprovado, serviço ainda não começou'; btn=`<button class="btn" onclick="avancar('Em execucao')">Iniciar serviço</button>`; }
  else if (o.Status==='Em execucao'){ titulo='Carro em serviço'; btn=`<button class="btn" onclick="avancar('Pronto p/ entrega')">Serviço pronto</button>`; }
  else if (o.Status==='Pronto p/ entrega'){
    titulo = t.saldo>0 ? `Pronto. Ainda falta receber ${moeda(t.saldo)}` : 'Pronto e pago';
    btn = t.saldo>0
      ? `<button class="btn" onclick="avancar('Finalizado')">Entregar sem receber tudo</button>
         <button class="btn tape" onclick="abrirPag()">Receber pagamento</button>`
      : `<button class="btn" onclick="avancar('Finalizado')">Entregar e finalizar</button>`;
  }
  else if (espera){ titulo=`Carro entregue. Falta receber ${moeda(t.saldo)}`; btn=`<button class="btn tape" onclick="abrirPag()">Receber pagamento</button>`; }
  else if (o.Status==='Finalizado'){ titulo='Serviço entregue e pago'; btn=`<button class="btn sec" onclick="arquivarOrc()">Arquivar (tirar do painel)</button>`; }

  h += `<div class="proximo"><p>${titulo}</p>${btn}</div>`;
  if (ANTERIOR[o.Status]) h += `<button class="voltar-etapa" onclick="voltarEtapa()">Voltar uma etapa</button>`;
  return h;
}

/* --- campos --- */
function lerCampos(){
  const g = i => { const el=$('#'+i); return el ? el.value : undefined; };
  const o = rascunho.orcamento;
  const nomeNovo = g('fCli');
  if (nomeNovo!==undefined && semAcento(nomeNovo.trim())!==semAcento(String(o.ClienteNome||'').trim())) o.ClienteID = '';
  const map = {ClienteNome:'fCli',Telefone:'fTel',Placa:'fPlaca',Data:'fData',Modelo:'fModelo',Ano:'fAno',Cor:'fCor',Obs:'fObs'};
  for (const k in map){ const v = g(map[k]); if (v!==undefined) o[k] = k==='Placa' ? v.toUpperCase() : v; }
}
function setItem(ix,campo,v){ lerCampos(); rascunho.itens[ix][campo]=v; telaEditor(); }
function addItem(){ lerCampos(); rascunho.itens.push({ID:id('I'),Descricao:'',Qtd:1,Valor:'',FotoURL:''}); telaEditor();
  const ins = document.querySelectorAll('.item .top input'); const ult = ins[ins.length-1]; if (ult) ult.focus(); }
function removerItem(ix){ lerCampos(); rascunho.itens.splice(ix,1); if(!rascunho.itens.length) addItem(); else telaEditor(); }

/* --- serviço só da lista --- */
function filtrarServicos(termo){
  const t = semAcento(termo.trim());
  let l = dados.servicos.slice();
  if (t){
    const comeca = l.filter(s=> semAcento(s.Descricao).startsWith(t));
    const contem = l.filter(s=> !semAcento(s.Descricao).startsWith(t) && semAcento(s.Descricao).includes(t));
    l = comeca.concat(contem);
  } else l.sort((a,b)=> String(a.Descricao).localeCompare(String(b.Descricao)));
  return l.slice(0,10);
}

function sugerir(input, ix){
  fecharSug();
  const termo = input.value;
  const lista = filtrarServicos(termo);
  const exato = dados.servicos.some(s=> semAcento(s.Descricao)===semAcento(termo.trim()));
  const box = document.createElement('div');
  box.className = 'sugbox';
  let h = lista.map((s,k)=>
    `<button type="button" data-k="${k}"><b>${esc(s.Descricao)}</b><span>${moeda(s.ValorPadrao)}</span></button>`).join('');
  if (termo.trim() && !exato) h += `<button type="button" class="novo" data-novo="1">＋ Cadastrar “${esc(termo.trim())}” na lista</button>`;
  if (!h) return;
  box.innerHTML = h;
  box.querySelectorAll('button').forEach(b=>{
    b.addEventListener('pointerdown', ev=> ev.preventDefault());
    b.addEventListener('mousedown', ev=> ev.preventDefault());
    b.addEventListener('click', ()=>{
      if (b.dataset.novo) cadastrarRapido(ix, termo.trim());
      else escolherServico(ix, lista[+b.dataset.k]);
    });
  });
  input.closest('.sug').appendChild(box);
}
function fecharSug(){ document.querySelectorAll('.sugbox').forEach(b=>b.remove()); }
document.addEventListener('click', e=>{ if (!e.target.closest('.sug')) fecharSug(); });

function escolherServico(ix, s){
  lerCampos();
  rascunho.itens[ix].Descricao = s.Descricao;
  rascunho.itens[ix].Valor = s.ValorPadrao;
  fecharSug(); telaEditor();
}

// ao sair do campo, só fica o que foi escolhido da lista
function conferir(input, ix){
  setTimeout(()=>{
    if (!document.body.contains(input) || document.activeElement===input) return;
    const certo = rascunho.itens[ix] ? (rascunho.itens[ix].Descricao||'') : '';
    if (input.value !== certo){
      if (input.value.trim()) aviso('Escolha um serviço da lista ou toque em “Cadastrar” para criar um novo.', true);
      input.value = certo;
    }
    fecharSug();
  }, 250);
}

async function cadastrarRapido(ix, desc){
  fecharSug();
  const v = prompt(`Valor padrão de "${desc}":`, '');
  if (v===null) return;
  const cat = prompt('Categoria (Funilaria, Pintura, Peça, Acabamento…):', 'Funilaria');
  if (cat===null) return;
  try{
    const s = await chamar('salvarServico', { servico:{ID:'', Descricao:desc, Categoria:cat, ValorPadrao:num(v)} });
    dados.servicos.push(s); salvarCache();
    escolherServico(ix, s);
    aviso('Serviço cadastrado na lista');
  }catch(e){ aviso(e.message, true); }
}

function ligarCliente(){
  const el = $('#fCli'); if (!el) return;
  el.oninput = el.onfocus = ()=>{
    fecharSug();
    const termo = semAcento(el.value.trim());
    const lista = dados.clientes.filter(c=> !termo || semAcento(c.Nome).includes(termo)).slice(0,6);
    if (!lista.length) return;
    const box = document.createElement('div');
    box.className='sugbox';
    box.innerHTML = lista.map((c,k)=>`<button type="button" data-k="${k}"><b>${esc(c.Nome)}</b><span>${esc(c.Telefone)}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b=>{
      b.addEventListener('pointerdown', ev=> ev.preventDefault());
      b.addEventListener('mousedown', ev=> ev.preventDefault());
      b.addEventListener('click', ()=>{
        const c = lista[+b.dataset.k];
        el.value=c.Nome; $('#fTel').value=c.Telefone; fecharSug();
        lerCampos(); rascunho.orcamento.ClienteID = c.ID; mostrarVeiculos();
      });
    });
    el.closest('.sug').appendChild(box);
  };
}

/* --- foto --- */
function tirarFoto(ix){
  lerCampos();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    try{
      const b64 = await comprimir(f);
      rascunho.itens[ix].FotoURL = 'data:image/jpeg;base64,'+b64;
      rascunho.itens[ix]._novaFoto = b64;
      telaEditor();
      aviso('Foto anexada. Ela vai para o Drive quando você salvar.');
    }catch(e){ aviso('Não consegui ler a foto', true); }
  };
  inp.click();
}
function comprimir(file, max){
  max = max || 1280;
  return new Promise((ok,falha)=>{
    const img = new Image();
    img.onload = ()=>{
      const e = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',.72).split(',')[1]);
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(file);
  });
}

/* --- gravar tudo na planilha --- */
async function salvarTudo(msg){
  if (ocupado) return false;
  lerCampos();
  const o = rascunho.orcamento;
  if (!String(o.ClienteNome).trim() && !String(o.Placa).trim()){ aviso('Informe ao menos o cliente ou a placa', true); return false; }
  const itens = rascunho.itens.filter(i => String(i.Descricao).trim());
  if (!itens.length){ aviso('Escolha ao menos um serviço da lista', true); return false; }

  ocupado = true;
  aviso('Salvando…');
  try{
    for (const it of itens){
      if (it._novaFoto){
        aviso('Enviando foto…');
        const r = await chamar('enviarFoto', { base64: it._novaFoto, mime:'image/jpeg', nome:'orc-'+(o.Numero||'novo')+'-'+Date.now()+'.jpg' });
        it.FotoURL = r.url; delete it._novaFoto;
      }
    }
    const r = await chamar('salvarOrcamento', {
      orcamento:o,
      itens: itens.map(i=>({ID:i.ID,Descricao:i.Descricao,Qtd:num(i.Qtd)||1,Valor:num(i.Valor),FotoURL:i.FotoURL||''})),
      pagamentos: rascunho.pagamentos.map(p=>({ID:p.ID,Data:p.Data||hoje(),Valor:num(p.Valor),Forma:p.Forma||'Pix',Obs:p.Obs||''}))
    });
    rascunho.orcamento = r.orcamento;
    rascunho.itens = r.itens;
    rascunho.pagamentos = r.pagamentos;
    sincronizar(true);
    if (msg) aviso(msg);
    return true;
  }catch(e){ aviso(e.message, true); return false; }
  finally{ ocupado = false; }
}

async function salvar(){ if (await salvarTudo('Orçamento salvo')) telaEditor(); }

async function avancar(prox){
  if (!(await salvarTudo())) return;
  try{
    const o = await chamar('mudarStatus', { id: rascunho.orcamento.ID, status: prox });
    rascunho.orcamento = o;
    sincronizar(true);
    aviso(o.Status==='Aguardando pagamento' ? 'Entregue. Ficou aguardando pagamento.' : 'Agora está em: ' + ROTULO[o.Status]);
    telaEditor(); window.scrollTo(0,0);
  }catch(e){ aviso(e.message, true); }
}

async function voltarEtapa(){
  const ant = ANTERIOR[rascunho.orcamento.Status];
  if (!ant || !confirm('Voltar para "' + ROTULO[ant] + '"?')) return;
  try{
    const o = await chamar('mudarStatus', { id: rascunho.orcamento.ID, status: ant });
    rascunho.orcamento = o; sincronizar(true); telaEditor();
  }catch(e){ aviso(e.message, true); }
}

/* --- pagamento: um toque para receber --- */
function abrirPag(){
  lerCampos(); pagAberto = true; telaEditor();
  const s = $('#secPag'); if (s) s.scrollIntoView({behavior:'smooth', block:'start'});
}
function escolherForma(f){ const v = $('#pgValor').value; pagForma = f; lerCampos(); telaEditor(); $('#pgValor').value = v; }

async function confirmarPag(){
  const valor = num($('#pgValor').value);
  if (valor<=0){ aviso('Informe o valor recebido', true); return; }
  lerCampos();
  rascunho.pagamentos.push({ID:id('P'), Data:hoje(), Valor:valor, Forma:pagForma, Obs:''});
  pagAberto = false;
  const ok = await salvarTudo();
  if (!ok){ rascunho.pagamentos.pop(); telaEditor(); return; }
  const saldo = num(rascunho.orcamento.Saldo);
  aviso(saldo<=0
    ? (rascunho.orcamento.Status==='Finalizado' ? 'Pagamento recebido. Orçamento finalizado.' : 'Pagamento recebido. Totalmente pago.')
    : 'Pagamento recebido. Falta ' + moeda(saldo));
  telaEditor();
}

async function removerPag(ix){
  const p = rascunho.pagamentos[ix];
  if (!confirm(`Remover o pagamento de ${moeda(p.Valor)}?`)) return;
  rascunho.pagamentos.splice(ix,1);
  if (await salvarTudo('Pagamento removido')) telaEditor();
}

async function arquivarOrc(){
  try{
    await chamar('arquivar', { id: rascunho.orcamento.ID, arquivar:true });
    await sincronizar(true); aviso('Orçamento arquivado'); ir('painel');
  }catch(e){ aviso(e.message, true); }
}

async function excluir(){
  if (!confirm('Excluir este orçamento e tudo que está nele?')) return;
  try{
    await chamar('excluirOrcamento', { id: rascunho.orcamento.ID });
    await sincronizar(true); aviso('Orçamento excluído'); ir('painel');
  }catch(e){ aviso(e.message, true); }
}

/* ===================== PDF ===================== */
function montarPDF(){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:'mm', format:'a4'});
  const c = dados.config || {};
  const o = rascunho.orcamento;
  const itens = rascunho.itens.filter(i=>String(i.Descricao).trim());
  const t = totais();
  const M = 16;
  let y = 20;

  d.setFont('helvetica','bold'); d.setFontSize(16);
  d.text(String(c.oficina_nome||'Orçamento de serviços'), M, y);
  y += 6;
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  [c.oficina_endereco, c.oficina_telefone, c.oficina_doc].filter(Boolean).forEach(l=>{ d.text(String(l), M, y); y += 4.2; });
  d.setDrawColor(210); d.line(M, y+2, 194, y+2); y += 10;

  d.setTextColor(20); d.setFont('helvetica','bold'); d.setFontSize(12);
  d.text('Orçamento nº ' + (o.Numero||'—'), M, y);
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  d.text(dataBR(o.Data), 194, y, {align:'right'});
  y += 8;
  d.setTextColor(20); d.setFontSize(10);
  d.text('Cliente: ' + (o.ClienteNome||'—'), M, y); y += 5;
  const veic = [o.Modelo, o.Placa, o.Ano, o.Cor].filter(Boolean).join(' · ');
  if (veic){ d.text('Veículo: ' + veic, M, y); y += 5; }
  y += 4;

  d.setFillColor(20,23,26); d.rect(M, y-5, 178, 8, 'F');
  d.setTextColor(255); d.setFont('helvetica','bold'); d.setFontSize(9);
  d.text('Serviço', M+3, y); d.text('Qtd', 138, y, {align:'right'});
  d.text('Valor', 162, y, {align:'right'}); d.text('Total', 191, y, {align:'right'});
  y += 9;

  d.setTextColor(20); d.setFont('helvetica','normal'); d.setFontSize(10);
  itens.forEach(it=>{
    if (y > 258){ d.addPage(); y = 24; }
    const linhas = d.splitTextToSize(String(it.Descricao||''), 112);
    d.text(linhas, M+3, y);
    d.text(String(num(it.Qtd)||1), 138, y, {align:'right'});
    d.text(moeda(it.Valor), 162, y, {align:'right'});
    d.setFont('helvetica','bold'); d.text(moeda(num(it.Qtd)*num(it.Valor)), 191, y, {align:'right'}); d.setFont('helvetica','normal');
    y += 6 + (linhas.length-1)*5;
    d.setDrawColor(232); d.line(M, y-3, 194, y-3);
  });

  y += 4;
  if (y > 240){ d.addPage(); y = 24; }
  const linhaTot = (rot, val, forte)=>{
    d.setFont('helvetica', forte?'bold':'normal'); d.setFontSize(forte?13:10);
    d.text(rot, 150, y, {align:'right'}); d.text(moeda(val), 191, y, {align:'right'});
    y += forte ? 8 : 5.5;
  };
  linhaTot('Serviços', t.total, false);
  if (t.pago > 0){ linhaTot('Recebido', t.pago, false); linhaTot(t.saldo>0?'Falta receber':'Saldo', t.saldo, true); }
  else linhaTot('Total', t.total, true);

  if (o.Obs){
    y += 4; d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(90);
    d.text(d.splitTextToSize(String(o.Obs), 178), M, y);
  }
  const dias = parseInt(c.validade_dias,10);
  if (dias){ d.setFontSize(9); d.setTextColor(120); d.text('Validade deste orçamento: ' + dias + ' dias.', M, 282); }
  return d;
}

async function gerarPDF(compartilhar){
  lerCampos();
  if (!window.jspdf){ aviso('Abra o app conectado à internet uma vez para preparar o PDF', true); return; }
  const o = rascunho.orcamento;
  const nome = `Orcamento-${o.Numero||'novo'}-${String(o.Placa||o.ClienteNome||'').replace(/\W+/g,'')}.pdf`;
  const doc = montarPDF();
  if (!compartilhar){ doc.save(nome); return; }

  const blob = doc.output('blob');
  const arq = new File([blob], nome, {type:'application/pdf'});
  const texto = `Olá${o.ClienteNome?' '+String(o.ClienteNome).split(' ')[0]:''}! Segue o orçamento nº ${o.Numero||''} no valor de ${moeda(totais().total)}.`;

  if (navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({ files:[arq], title:nome, text:texto }); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  doc.save(nome);
  const tel = String(o.Telefone||'').replace(/\D/g,'');
  const numero = tel ? (tel.length<=11 ? '55'+tel : tel) : '';
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(texto+' (arquivo em anexo)'), '_blank');
  aviso('PDF baixado. Anexe na conversa que abriu.');
}

/* ===================== clientes ===================== */
const ultima = orcs => orcs.reduce((m,o)=> String(o.AtualizadoEm||o.Data||'')>m ? String(o.AtualizadoEm||o.Data||'') : m, '');

// junta orçamentos antigos (sem ClienteID) ao cliente certo pelo nome
function chaveCli(o){
  if (o.ClienteID) return 'id:' + o.ClienteID;
  const n = semAcento(String(o.ClienteNome||'').trim());
  const c = dados.clientes.find(c=> semAcento(String(c.Nome).trim())===n);
  return c ? 'id:' + c.ID : 'n:' + n;
}
function listaClientes(){
  const mapa = {};
  dados.clientes.forEach(c=>{ mapa['id:'+c.ID] = {chave:'id:'+c.ID, ID:c.ID, Nome:c.Nome, Telefone:c.Telefone, orcs:[]}; });
  dados.orcamentos.forEach(o=>{
    const k = chaveCli(o);
    if (!mapa[k]) mapa[k] = {chave:k, ID:o.ClienteID||'', Nome:o.ClienteNome||'Sem nome', Telefone:o.Telefone||'', orcs:[]};
    mapa[k].orcs.push(o);
  });
  return Object.values(mapa);
}
function veiculosDe(cli){
  const v = {};
  cli.orcs.slice().sort((a,b)=>String(a.Data).localeCompare(String(b.Data))).forEach(o=>{
    const p = String(o.Placa||'').toUpperCase().trim() || '—';
    if (!v[p]) v[p] = {Placa:String(o.Placa||'').toUpperCase(), Modelo:'', Ano:'', Cor:'', orcs:[]};
    ['Modelo','Ano','Cor'].forEach(c=>{ if (o[c]) v[p][c] = o[c]; });
    v[p].orcs.push(o);
  });
  return Object.values(v);
}
const emAberto = orcs => orcs.reduce((s,o)=> s + (o.Status!=='Orcamento' && String(o.Arquivado)!=='true' ? Math.max(0,num(o.Saldo)) : 0), 0);

function mostrarVeiculos(){
  const box = $('#veicChips'); if (!box) return;
  const o = rascunho.orcamento;
  const n = semAcento(String(o.ClienteNome||'').trim());
  const cli = n && listaClientes().find(c=> (o.ClienteID && String(c.ID)===String(o.ClienteID)) || semAcento(String(c.Nome).trim())===n);
  const vs = cli ? veiculosDe(cli).filter(v=>v.Placa) : [];
  if (!vs.length){ box.innerHTML=''; return; }
  box.innerHTML = `<label>Carros deste cliente</label><div class="formas">` +
    vs.map((v,k)=>`<button class="chip" data-k="${k}">${esc(v.Placa)}${v.Modelo?' · '+esc(v.Modelo):''}</button>`).join('') + `</div>`;
  box.querySelectorAll('button').forEach(b=> b.onclick = ()=>{
    const v = vs[+b.dataset.k];
    $('#fPlaca').value=v.Placa||''; $('#fModelo').value=v.Modelo||''; $('#fAno').value=v.Ano||''; $('#fCor').value=v.Cor||'';
    lerCampos(); aviso('Carro preenchido');
  });
}

function telaClientes(){
  cabecalho('Clientes','carros e histórico de cada um');
  const t = semAcento(buscaCli.trim());
  const lista = listaClientes()
    .filter(c=> !t || semAcento(c.Nome).includes(t) || String(c.Telefone).replace(/\D/g,'').includes(t.replace(/\D/g,'')||'#') ||
                 c.orcs.some(o=> semAcento(o.Placa).includes(t)))
    .sort((a,b)=> ultima(b.orcs).localeCompare(ultima(a.orcs)) || String(a.Nome).localeCompare(String(b.Nome)));
  let h = `<div class="wrap">
    <input class="busca" id="fBusca" value="${esc(buscaCli)}" placeholder="buscar por nome, telefone ou placa" autocomplete="off">`;
  if (!lista.length) h += `<div class="vazio">Nenhum cliente encontrado. Os clientes são cadastrados sozinhos quando você salva um orçamento.</div>`;
  lista.forEach(c=>{
    const nv = veiculosDe(c).filter(v=>v.Placa).length;
    const ab = emAberto(c.orcs);
    h += `<button class="card" onclick="ir('cliente','${esc(c.chave)}')">
      <div class="linha1"><div class="placa" style="letter-spacing:0;font-size:17px">${esc(c.Nome)}</div>
        ${ab>0?`<span class="dev">falta ${moeda(ab)}</span>`:''}</div>
      <div class="cli">${esc(c.Telefone||'sem telefone')} · ${nv} ${nv===1?'carro':'carros'} · ${c.orcs.length} ${c.orcs.length===1?'orçamento':'orçamentos'}</div>
    </button>`;
  });
  tela.innerHTML = h + '</div>';
  const b = $('#fBusca');
  b.oninput = ()=>{ buscaCli = b.value; const pos=b.selectionStart; telaClientes(); const n=$('#fBusca'); n.focus(); n.setSelectionRange(pos,pos); };
}

        <div class="st">${num(o.Total)>0&&num(o.Saldo)<=0?'<span class="pago">Pago</span>':num(o.Pago)>0?`<span class="dev">falta ${moeda(o.Saldo)}</span>`:''}</div>
      </button>`;
    });
    h += `</div>`;

  tela.innerHTML = h + '</div>';
}

/* ===================== caixa ===================== */
function intervalo(){
  const d = new Date();
  if (periodo==='hoje') return [hoje(), hoje(), 'Hoje'];
  if (periodo==='7d'){ const i=new Date(d); i.setDate(d.getDate()-6); return [ymd(i), hoje(), 'Últimos 7 dias']; }
  if (periodo==='mes') return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), hoje(), 'Este mês'];
  if (periodo==='mesant'){
    const i = new Date(d.getFullYear(), d.getMonth()-1, 1), f = new Date(d.getFullYear(), d.getMonth(), 0);
    return [ymd(i), ymd(f), i.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})];
  }
  return [pIni||hoje(), pFim||hoje(), 'Período escolhido'];
}
function mudarPeriodo(p){ periodo = p; telaCaixa(); }

function telaCaixa(){
  const [ini, fim, nome] = intervalo();
  cabecalho('Caixa', nome.charAt(0).toUpperCase()+nome.slice(1));
  const orcPorId = {}; dados.orcamentos.forEach(o=> orcPorId[o.ID]=o);
  const pags = dados.pagamentos
    .filter(p=>{ const d=String(p.Data).slice(0,10); return d>=ini && d<=fim; })
    .sort((a,b)=> String(b.Data).localeCompare(String(a.Data)));
  const total = pags.reduce((s,p)=>s+num(p.Valor),0);
  const porForma = {};
  pags.forEach(p=>{ porForma[p.Forma||'Outro'] = (porForma[p.Forma||'Outro']||0) + num(p.Valor); });

  const ativos = dados.orcamentos.filter(o=>String(o.Arquivado)!=='true' && o.Status!=='Orcamento' && num(o.Saldo)>0);
  const entregues = ativos.filter(o=>o.Status==='Aguardando pagamento').reduce((s,o)=>s+num(o.Saldo),0);
  const emServico = ativos.filter(o=>o.Status!=='Aguardando pagamento').reduce((s,o)=>s+num(o.Saldo),0);

  const ops = [['hoje','Hoje'],['7d','7 dias'],['mes','Este mês'],['mesant','Mês passado'],['outro','Escolher']];
  let h = `<div class="chips">${ops.map(([k,r])=>`<button class="chip" aria-pressed="${periodo===k}" onclick="mudarPeriodo('${k}')">${r}</button>`).join('')}</div><div class="wrap">`;
  if (periodo==='outro'){
    h += `<div class="periodo">
      <div><label for="pIni" style="margin-top:0">De</label><input id="pIni" type="date" value="${ini}"></div>
      <div><label for="pFim" style="margin-top:0">Até</label><input id="pFim" type="date" value="${fim}"></div></div>`;
  }
  h += `<div class="recebido"><span>Recebido</span><div class="v">${moeda(total)}</div>
    ${Object.keys(porForma).map(f=>`<div class="l"><span>${FORMA_ROT[f]||f}</span><b>${moeda(porForma[f])}</b></div>`).join('')}
    ${!pags.length?'<div class="l"><span>Nenhum recebimento no período</span></div>':''}
  </div>
  <div class="tot-box">
    <div class="l"><span>A receber de carros já entregues</span><b class="${entregues>0?'saldo-dev':''}">${moeda(entregues)}</b></div>
    <div class="l"><span>A receber de serviços em andamento</span><b>${moeda(emServico)}</b></div>
  </div>
  <div class="secao">Recebimentos (${pags.length})</div>`;
  pags.forEach(p=>{
    const o = orcPorId[p.OrcamentoID] || {};
    h += `<button class="pgrow" onclick="${o.ID?`abrir('${o.ID}')`:''}">
      <b>${esc(o.ClienteNome||'Orçamento removido')}</b><span class="vl">${moeda(p.Valor)}</span>
      <small>${dataBR(p.Data)} · ${esc(o.Placa||'')} ${o.Numero?'· nº '+esc(o.Numero):''}</small><small style="text-align:right">${FORMA_ROT[p.Forma]||p.Forma}</small>
    </button>`;
  });
  tela.innerHTML = h + '</div>';
  if (periodo==='outro'){
    $('#pIni').onchange = e=>{ pIni = e.target.value; telaCaixa(); };
    $('#pFim').onchange = e=>{ pFim = e.target.value; telaCaixa(); };
  }
}

function telaServicos(){
  cabecalho('Serviços','a lista que aparece nos orçamentos');
  let h = `<div class="wrap"><button class="btn" onclick="editarServico()">Adicionar serviço</button>`;
  const porCat = {};
  dados.servicos.forEach(s=>{ (porCat[s.Categoria||'Outros'] = porCat[s.Categoria||'Outros']||[]).push(s); });
  Object.keys(porCat).sort().forEach(cat=>{

async function editarServico(sid){
  const s = dados.servicos.find(x=>String(x.ID)===String(sid)) || {ID:'',Descricao:'',Categoria:'Funilaria',ValorPadrao:''};
  const desc = prompt('Descrição do serviço:', s.Descricao); if (desc===null || !desc.trim()) return;
  const valor = prompt('Valor padrão (só números):', s.ValorPadrao); if (valor===null) return;
  const cat = prompt('Categoria:', s.Categoria||'Funilaria'); if (cat===null) return;
  try{
    await chamar('salvarServico', { servico:{ID:s.ID, Descricao:desc.trim(), Categoria:cat, ValorPadrao:num(valor)} });
    await sincronizar(true); aviso('Serviço salvo'); telaServicos();
  }catch(e){ aviso(e.message, true); }
}

      <div class="l"><span>Arquivados</span><b>${arq}</b></div>
      <div class="l"><span>Serviços cadastrados</span><b>${dados.servicos.length}</b></div>
      <div class="l"><span>Clientes</span><b>${dados.clientes.length}</b></div>
    </div>
    <div class="aviso" style="margin-top:14px">Os dados ficam na sua planilha do Google. O app guarda uma cópia no aparelho para abrir mais rápido.</div>
    <p style="text-align:center;color:var(--steel);font-size:12px">versão 3</p>
  </div>`;
}
async function salvarApi(){
  API = $('#fApi').value.trim();
  localStorage.setItem('api_url', API);
  await sincronizar();
  ir('painel');
}
