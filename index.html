<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Orçamentos — Funilaria</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#14171A; --steel:#6B7480; --primer:#E9EBEE; --paper:#fff;
  --line:#D5DAE0; --tape:#F5C518; --ok:#1E8E5A; --debt:#C8372D;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--primer);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* topo */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;
}
header h1{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0;flex:1}
header .sub{font-size:12px;font-weight:500;color:#9AA3AE;display:block;letter-spacing:0}
.iconbtn{color:#fff;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:#2A2F36}

main{padding:16px 0 96px}
.wrap{padding:0 16px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 84%;max-width:340px;scroll-snap-align:center}
.colhead{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px}
.colhead b{font-size:14px;font-weight:800}
.colhead span{font-size:12px;color:var(--steel);font-weight:600}
.colhead .bar{height:3px;border-radius:2px;background:var(--ink);flex:1}
.col[data-s="Aguardando pagamento"] .bar{background:var(--debt)}
.col[data-s="Finalizado"] .bar{background:var(--ok)}
.col[data-s="Em execucao"] .bar{background:var(--tape)}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:10px;display:block;width:100%;text-align:left;
}
.card:active{border-color:var(--ink)}
.card .placa{font-size:19px;font-weight:800;letter-spacing:1px}
.card .cli{font-size:13px;color:var(--steel);margin-top:1px}
.card .rod{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.card .tot{font-size:17px;font-weight:800}
.card .dev{font-size:12px;font-weight:600;color:var(--debt)}
.card .num{font-size:11px;color:var(--steel);font-weight:600}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;color:var(--steel);font-size:13px}

/* formulário */
label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:14px 0 5px}
input,select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,23,26,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* itens */
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.item .top{display:flex;gap:8px;align-items:center}
.item .top input{border:none;padding:4px 0;font-weight:600;background:none}
.item .top input:focus{box-shadow:none}
.item .lin{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;margin-top:8px}
.item .lin input{padding:9px;text-align:right}
.del{width:38px;height:38px;border-radius:var(--r);color:var(--steel);font-size:20px;display:grid;place-items:center}
.foto{margin-top:10px;display:flex;gap:10px;align-items:center}
.foto img{width:64px;height:64px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.fotobtn{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;font-weight:600;color:var(--steel);background:var(--paper)}

/* sugestões */
.sug{position:relative}
.sugbox{
  position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--paper);
  border:1px solid var(--ink);border-radius:var(--r);margin-top:4px;overflow:hidden;
  max-height:220px;overflow-y:auto;box-shadow:0 10px 24px rgba(20,23,26,.14)
}
.sugbox button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.sugbox button:last-child{border-bottom:none}
.sugbox button:active{background:var(--primer)}
.sugbox b{font-weight:600}
.sugbox span{color:var(--steel);font-size:13px;white-space:nowrap}

/* totais */
.tot-box{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-top:16px}
.tot-box .l{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#B9C0C8}
.tot-box .l b{color:#fff;font-weight:600}
.tot-box .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #2F353C;margin-top:8px;padding-top:10px}
.tot-box .big span{font-size:13px;color:#B9C0C8}
.tot-box .big b{font-size:24px;font-weight:800}
.saldo-dev{color:#FFB4AC!important}
.saldo-ok{color:#7FD6A8!important}

/* botões */
.btn{display:block;width:100%;padding:15px;border-radius:var(--r);font-weight:700;text-align:center;background:var(--ink);color:#fff;margin-top:10px}
.btn:active{opacity:.85}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.tape{background:var(--tape);color:var(--ink)}
.btn.ghost{background:none;color:var(--debt);font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acoes .btn{margin-top:0}

/* status atual */
.statusbar{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.statusbar b{font-size:14px;flex:1}
.statusbar small{color:var(--steel);font-size:12px}

/* lista serviços */
.srv{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.srv .d{flex:1;font-weight:600;font-size:15px}
.srv .c{font-size:12px;color:var(--steel)}
.srv .v{font-weight:700}

/* barra inferior */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{padding:10px 4px 12px;font-size:11px;font-weight:600;color:var(--steel);display:grid;gap:3px;justify-items:center}
nav button .i{font-size:20px;line-height:1}
nav button[aria-current="true"]{color:var(--ink)}
nav button[aria-current="true"] .i{transform:translateY(-1px)}

/* avisos */
.toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:var(--r);z-index:60;font-size:14px;font-weight:500}
.toast.err{background:var(--debt)}
.hide{display:none!important}
.carregando{text-align:center;color:var(--steel);padding:40px 16px;font-size:14px}
.aviso{background:#FFF6D6;border:1px solid var(--tape);border-radius:var(--r);padding:12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sobe .18s ease-out}}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
</style>
</head>
<body>

<header>
  <button class="iconbtn hide" id="btVoltar" aria-label="Voltar">←</button>
  <h1 id="titulo">Painel<span class="sub" id="subtitulo">orçamentos em andamento</span></h1>
  <button class="iconbtn" id="btSync" aria-label="Atualizar">⟳</button>
</header>

<main id="tela"><div class="carregando">Carregando…</div></main>

<nav>
  <button data-ir="painel" aria-current="true"><span class="i">▦</span>Painel</button>
  <button data-ir="novo"><span class="i">＋</span>Novo</button>
  <button data-ir="servicos"><span class="i">☰</span>Serviços</button>
  <button data-ir="ajustes"><span class="i">⚙</span>Ajustes</button>
</nav>

<script>
/* ===================== estado ===================== */
const STATUS = ['Orcamento','Aprovado','Em execucao','Pronto p/ entrega','Aguardando pagamento','Finalizado'];
const ROTULO = {
  'Orcamento':'Orçamento','Aprovado':'Aprovado','Em execucao':'Em execução',
  'Pronto p/ entrega':'Pronto p/ entrega','Aguardando pagamento':'Aguardando pagamento','Finalizado':'Finalizado'
};
const PROXIMO = {
  'Orcamento':'Aprovado','Aprovado':'Em execucao','Em execucao':'Pronto p/ entrega',
  'Pronto p/ entrega':'Finalizado','Aguardando pagamento':'Finalizado'
};
const FORMAS = ['Dinheiro','Pix','Cartao','Transferencia'];

let API = localStorage.getItem('api_url') || '';
let dados = { config:{}, clientes:[], servicos:[], orcamentos:[], itens:[], pagamentos:[] };
let rascunho = null;
let telaAtual = 'painel';

const $ = s => document.querySelector(s);
const tela = $('#tela');

/* ===================== utilidades ===================== */
const num = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
};
const moeda = v => num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje = () => new Date().toISOString().slice(0,10);
const dataBR = d => { const p=String(d||'').slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : (d||''); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = p => p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*1000).toString(36).toUpperCase();

function aviso(msg, erro){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), erro ? 5000 : 2600);
}

async function chamar(action, corpo){
  if (!API) throw new Error('Configure o endereço da API em Ajustes');
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, corpo||{}))
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Falha na API');
  return j.data;
}

function salvarCache(){ localStorage.setItem('cache', JSON.stringify(dados)); }
function lerCache(){
  try { const c = JSON.parse(localStorage.getItem('cache')); if (c && c.orcamentos) dados = c; } catch(e){}
}

async function sincronizar(silencioso){
  if (!API) return;
  try{
    dados = await chamar('carregar');
    salvarCache();
    if (!silencioso) aviso('Dados atualizados');
    render();
  }catch(e){
    if (!silencioso) aviso(e.message, true);
  }
}

/* ===================== navegação ===================== */
function ir(t, arg){
  telaAtual = t;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.ir===t ? 'true':'false'));
  $('#btVoltar').classList.toggle('hide', t==='painel');
  if (t==='novo'){ rascunho = novoRascunho(); telaAtual='editor'; }
  if (t==='editor' && arg) rascunho = arg;
  render();
}
$('#btVoltar').onclick = ()=> ir('painel');
$('#btSync').onclick = ()=> sincronizar();
document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> ir(b.dataset.ir));

function cabecalho(t, s){ $('#titulo').childNodes[0].nodeValue = t; $('#subtitulo').textContent = s; }

function render(){
  if (telaAtual==='painel') telaPainel();
  else if (telaAtual==='editor') telaEditor();
  else if (telaAtual==='servicos') telaServicos();
  else if (telaAtual==='ajustes') telaAjustes();
}

/* ===================== painel ===================== */
function telaPainel(){
  cabecalho('Painel','orçamentos em andamento');
  const ativos = dados.orcamentos.filter(o => String(o.Arquivado)!=='true');

  if (!API){
    tela.innerHTML = `<div class="wrap">
      <div class="aviso">Antes de usar, informe o endereço da API em <b>Ajustes</b>. É o link que o Apps Script gerou ao publicar.</div>
      <button class="btn" onclick="ir('ajustes')">Abrir ajustes</button></div>`;
    return;
  }
  if (!ativos.length){
    tela.innerHTML = `<div class="wrap"><div class="vazio">Nenhum orçamento em andamento.<br>Toque em <b>Novo</b> para criar o primeiro.</div></div>`;
    return;
  }

  let h = '<div class="board">';
  STATUS.forEach(s=>{
    const lista = ativos.filter(o=>o.Status===s);
    if (!lista.length) return;
    h += `<section class="col" data-s="${esc(s)}">
      <div class="colhead"><b>${ROTULO[s]}</b><span>${lista.length}</span><i class="bar"></i></div>`;
    lista.forEach(o=>{
      const dev = num(o.Saldo) > 0;
      h += `<button class="card" onclick="abrir('${o.ID}')">
        <div class="placa">${esc(o.Placa||'sem placa')}</div>
        <div class="cli">${esc(o.ClienteNome||'')}${o.Modelo?' · '+esc(o.Modelo):''}</div>
        <div class="rod">
          <div><div class="tot">${moeda(o.Total)}</div>
          ${dev?`<div class="dev">falta ${moeda(o.Saldo)}</div>`:''}</div>
          <div class="num">nº ${esc(o.Numero)} · ${dataBR(o.Data)}</div>
        </div></button>`;
    });
    h += '</section>';
  });
  tela.innerHTML = h + '</div>';
}

function abrir(oid){
  const o = dados.orcamentos.find(x=>String(x.ID)===String(oid));
  if (!o) return;
  ir('editor', {
    orcamento: Object.assign({}, o),
    itens: dados.itens.filter(i=>String(i.OrcamentoID)===String(oid))
             .sort((a,b)=>num(a.Ordem)-num(b.Ordem)).map(i=>Object.assign({},i)),
    pagamentos: dados.pagamentos.filter(p=>String(p.OrcamentoID)===String(oid)).map(p=>Object.assign({},p))
  });
}

function novoRascunho(){
  return {
    orcamento:{ ID:'', Numero:'', Data:hoje(), ClienteNome:'', Telefone:'', Placa:'', Modelo:'', Ano:'', Cor:'', Status:'Orcamento', Obs:'', Arquivado:false },
    itens:[{ ID:id('I'), Descricao:'', Qtd:1, Valor:'', FotoURL:'' }],
    pagamentos:[]
  };
}

/* ===================== editor ===================== */
function totais(){
  const total = rascunho.itens.reduce((s,i)=> s + num(i.Qtd)*num(i.Valor), 0);
  const pago  = rascunho.pagamentos.reduce((s,p)=> s + num(p.Valor), 0);
  return { total, pago, saldo: total - pago };
}

function telaEditor(){
  const o = rascunho.orcamento;
  const t = totais();
  const novo = !o.ID;
  cabecalho(novo ? 'Novo orçamento' : (o.Placa || 'Orçamento'), novo ? 'preencha e salve' : `nº ${o.Numero} · ${ROTULO[o.Status]||o.Status}`);

  let h = '<div class="wrap">';

  if (!novo){
    const dev = t.saldo > 0;
    h += `<div class="statusbar">
      <i class="dot" style="background:${o.Status==='Finalizado'?'var(--ok)':dev&&o.Status==='Aguardando pagamento'?'var(--debt)':'var(--ink)'}"></i>
      <b>${ROTULO[o.Status]||o.Status}</b>
      <small>${dev?'falta '+moeda(t.saldo):'quitado'}</small></div>`;
  }

  h += `<label for="fCli">Cliente</label>
  <div class="sug"><input id="fCli" value="${esc(o.ClienteNome)}" placeholder="nome do cliente" autocomplete="off"></div>
  <label for="fTel">WhatsApp (com DDD)</label>
  <input id="fTel" value="${esc(o.Telefone)}" inputmode="tel" placeholder="69 99999-9999">

  <div class="grid2">
    <div><label for="fPlaca">Placa</label><input id="fPlaca" value="${esc(o.Placa)}" style="text-transform:uppercase" placeholder="ABC1D23"></div>
    <div><label for="fData">Data</label><input id="fData" type="date" value="${esc(String(o.Data||hoje()).slice(0,10))}"></div>
  </div>
  <label for="fModelo">Veículo</label>
  <input id="fModelo" value="${esc(o.Modelo)}" placeholder="Gol, Onix, Hilux…">
  <div class="grid2">
    <div><label for="fAno">Ano</label><input id="fAno" value="${esc(o.Ano)}" inputmode="numeric" placeholder="2018"></div>
    <div><label for="fCor">Cor</label><input id="fCor" value="${esc(o.Cor)}" placeholder="prata"></div>
  </div>

  <label>Serviços</label>`;

  rascunho.itens.forEach((it,ix)=>{
    h += `<div class="item">
      <div class="top sug">
        <input value="${esc(it.Descricao)}" placeholder="digite p, porta, para-choque…"
               oninput="sugerir(this,${ix})" onfocus="sugerir(this,${ix})" autocomplete="off">
        <button class="del" onclick="removerItem(${ix})" aria-label="Remover serviço">×</button>
      </div>
      <div class="lin">
        <input value="${esc(it.Qtd||1)}" inputmode="numeric" aria-label="Quantidade" onchange="setItem(${ix},'Qtd',this.value)">
        <input value="${esc(it.Valor)}" inputmode="decimal" placeholder="0,00" aria-label="Valor" onchange="setItem(${ix},'Valor',this.value)">
        <b>${moeda(num(it.Qtd)*num(it.Valor))}</b>
      </div>
      <div class="foto">
        ${it.FotoURL?`<img src="${esc(it.FotoURL)}" alt="Foto do serviço">`:''}
        <button class="fotobtn" onclick="tirarFoto(${ix})">${it.FotoURL?'Trocar foto':'📷 Tirar foto'}</button>
      </div>
    </div>`;
  });

  h += `<button class="btn sec" onclick="addItem()">Adicionar serviço</button>`;

  h += `<div class="tot-box">
    <div class="l"><span>Serviços</span><b>${moeda(t.total)}</b></div>
    <div class="l"><span>Pago</span><b>${moeda(t.pago)}</b></div>
    <div class="big"><span>Saldo</span><b class="${t.saldo>0?'saldo-dev':'saldo-ok'}">${moeda(t.saldo)}</b></div>
  </div>`;

  h += `<label>Pagamentos</label>`;
  if (!rascunho.pagamentos.length) h += `<div class="vazio">Nenhum pagamento lançado.</div>`;
  rascunho.pagamentos.forEach((p,ix)=>{
    h += `<div class="item"><div class="lin" style="grid-template-columns:1fr 100px auto;margin-top:0">
      <select onchange="setPag(${ix},'Forma',this.value)">
        ${FORMAS.map(f=>`<option ${p.Forma===f?'selected':''}>${f}</option>`).join('')}
      </select>
      <input value="${esc(p.Valor)}" inputmode="decimal" onchange="setPag(${ix},'Valor',this.value)" aria-label="Valor pago">
      <button class="del" onclick="removerPag(${ix})" aria-label="Remover pagamento">×</button>
    </div></div>`;
  });
  h += `<button class="btn sec" onclick="addPag()">Lançar pagamento${t.saldo>0?' de '+moeda(t.saldo):''}</button>`;

  h += `<label for="fObs">Observações</label>
  <textarea id="fObs" rows="2" placeholder="prazo, condições, garantia…">${esc(o.Obs)}</textarea>`;

  h += `<button class="btn" onclick="salvar()">Salvar orçamento</button>`;

  if (!novo){
    h += `<div class="acoes">
      <button class="btn tape" onclick="gerarPDF(true)">Enviar no WhatsApp</button>
      <button class="btn sec" onclick="gerarPDF(false)">Baixar PDF</button>
    </div>`;
    const prox = PROXIMO[o.Status];
    if (prox){
      const rotulo = prox==='Finalizado' && t.saldo>0 ? 'Concluir (vai para espera)' : 'Avançar para ' + ROTULO[prox].toLowerCase();
      h += `<button class="btn" onclick="avancar('${prox}')">${rotulo}</button>`;
    }
    if (o.Status==='Finalizado') h += `<button class="btn sec" onclick="arquivarOrc()">Arquivar</button>`;
    h += `<button class="btn ghost" onclick="excluir()">Excluir orçamento</button>`;
  }

  tela.innerHTML = h + '</div>';
  ligarCliente();
}

/* --- campos --- */
function lerCampos(){
  const g = i => { const el=$('#'+i); return el ? el.value : ''; };
  Object.assign(rascunho.orcamento, {
    ClienteNome:g('fCli'), Telefone:g('fTel'), Placa:g('fPlaca').toUpperCase(),
    Data:g('fData'), Modelo:g('fModelo'), Ano:g('fAno'), Cor:g('fCor'), Obs:g('fObs')
  });
}
function setItem(ix,campo,v){ lerCampos(); rascunho.itens[ix][campo]=v; telaEditor(); }
function addItem(){ lerCampos(); guardarDescricoes(); rascunho.itens.push({ID:id('I'),Descricao:'',Qtd:1,Valor:'',FotoURL:''}); telaEditor(); }
function removerItem(ix){ lerCampos(); guardarDescricoes(); rascunho.itens.splice(ix,1); if(!rascunho.itens.length) addItem(); else telaEditor(); }
function setPag(ix,campo,v){ lerCampos(); guardarDescricoes(); rascunho.pagamentos[ix][campo]=v; telaEditor(); }
function removerPag(ix){ lerCampos(); guardarDescricoes(); rascunho.pagamentos.splice(ix,1); telaEditor(); }
function addPag(){
  lerCampos(); guardarDescricoes();
  const t = totais();
  rascunho.pagamentos.push({ID:id('P'), Data:hoje(), Valor: t.saldo>0 ? t.saldo : '', Forma:'Pix', Obs:''});
  telaEditor();
}
// pega o que foi digitado nos campos de descrição antes de redesenhar a tela
function guardarDescricoes(){
  document.querySelectorAll('.item .top input').forEach((el,ix)=>{
    if (rascunho.itens[ix]) rascunho.itens[ix].Descricao = el.value;
  });
}

/* --- autocomplete de serviços --- */
function sugerir(input, ix){
  guardarDescricoes();
  fecharSug();
  const termo = input.value.trim().toLowerCase();
  let lista = dados.servicos;
  if (termo) lista = lista.filter(s => String(s.Descricao).toLowerCase().includes(termo));
  lista = lista.slice(0,8);
  if (!lista.length) return;
  const box = document.createElement('div');
  box.className = 'sugbox';
  box.innerHTML = lista.map(s=>
    `<button type="button" data-d="${esc(s.Descricao)}" data-v="${esc(s.ValorPadrao)}">
      <b>${esc(s.Descricao)}</b><span>${moeda(s.ValorPadrao)}</span></button>`).join('');
  box.querySelectorAll('button').forEach(b=> b.onmousedown = ev=>{
    ev.preventDefault();
    rascunho.itens[ix].Descricao = b.dataset.d;
    if (!num(rascunho.itens[ix].Valor)) rascunho.itens[ix].Valor = b.dataset.v;
    lerCampos(); telaEditor();
  });
  input.closest('.sug').appendChild(box);
}
function fecharSug(){ document.querySelectorAll('.sugbox').forEach(b=>b.remove()); }
document.addEventListener('click', e=>{ if (!e.target.closest('.sug')) fecharSug(); });

function ligarCliente(){
  const el = $('#fCli'); if (!el) return;
  el.oninput = el.onfocus = ()=>{
    fecharSug();
    const termo = el.value.trim().toLowerCase();
    const lista = dados.clientes.filter(c=> !termo || String(c.Nome).toLowerCase().includes(termo)).slice(0,6);
    if (!lista.length) return;
    const box = document.createElement('div');
    box.className='sugbox';
    box.innerHTML = lista.map(c=>`<button type="button" data-n="${esc(c.Nome)}" data-t="${esc(c.Telefone)}"><b>${esc(c.Nome)}</b><span>${esc(c.Telefone)}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b=> b.onmousedown = ev=>{
      ev.preventDefault();
      el.value = b.dataset.n; $('#fTel').value = b.dataset.t; fecharSug();
    });
    el.closest('.sug').appendChild(box);
  };
}

/* --- foto --- */
function tirarFoto(ix){
  lerCampos(); guardarDescricoes();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    aviso('Preparando a foto…');
    try{
      const b64 = await comprimir(f);
      rascunho.itens[ix].FotoURL = 'data:image/jpeg;base64,'+b64;
      rascunho.itens[ix]._novaFoto = b64;
      telaEditor();
      aviso('Foto anexada. Salve para enviar ao Drive.');
    }catch(e){ aviso('Não consegui ler a foto', true); }
  };
  inp.click();
}

function comprimir(file, max){
  max = max || 1280;
  return new Promise((ok,falha)=>{
    const img = new Image();
    img.onload = ()=>{
      const e = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',.72).split(',')[1]);
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(file);
  });
}

/* --- salvar --- */
async function salvar(){
  lerCampos(); guardarDescricoes();
  const o = rascunho.orcamento;
  if (!o.ClienteNome.trim() && !o.Placa.trim()){ aviso('Informe ao menos o cliente ou a placa', true); return; }
  rascunho.itens = rascunho.itens.filter(i => String(i.Descricao).trim() || num(i.Valor));
  if (!rascunho.itens.length){ aviso('Adicione ao menos um serviço', true); return; }

  aviso('Salvando…');
  try{
    for (const it of rascunho.itens){
      if (it._novaFoto){
        const r = await chamar('enviarFoto', { base64: it._novaFoto, mime:'image/jpeg', nome:'orc-'+(o.Numero||'novo')+'-'+Date.now()+'.jpg' });
        it.FotoURL = r.url; delete it._novaFoto;
      }
    }
    const r = await chamar('salvarOrcamento', {
      orcamento:o,
      itens: rascunho.itens.map(i=>({ID:i.ID,Descricao:i.Descricao,Qtd:num(i.Qtd)||1,Valor:num(i.Valor),FotoURL:i.FotoURL||''})),
      pagamentos: rascunho.pagamentos.map(p=>({ID:p.ID,Data:p.Data||hoje(),Valor:num(p.Valor),Forma:p.Forma||'Pix',Obs:p.Obs||''}))
    });
    rascunho.orcamento = r.orcamento;
    await sincronizar(true);
    aviso('Orçamento salvo');
    telaEditor();
  }catch(e){ aviso(e.message, true); }
}

async function avancar(prox){
  if (!rascunho.orcamento.ID) return;
  try{
    const o = await chamar('mudarStatus', { id: rascunho.orcamento.ID, status: prox });
    rascunho.orcamento = o;
    await sincronizar(true);
    aviso('Agora está em: ' + (ROTULO[o.Status]||o.Status));
    telaEditor();
  }catch(e){ aviso(e.message, true); }
}

async function arquivarOrc(){
  try{
    await chamar('arquivar', { id: rascunho.orcamento.ID, arquivar:true });
    await sincronizar(true); aviso('Orçamento arquivado'); ir('painel');
  }catch(e){ aviso(e.message, true); }
}

async function excluir(){
  if (!confirm('Excluir este orçamento e tudo que está nele?')) return;
  try{
    await chamar('excluirOrcamento', { id: rascunho.orcamento.ID });
    await sincronizar(true); aviso('Orçamento excluído'); ir('painel');
  }catch(e){ aviso(e.message, true); }
}

/* ===================== PDF ===================== */
function montarPDF(){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:'mm', format:'a4'});
  const c = dados.config || {};
  const o = rascunho.orcamento;
  const t = totais();
  const M = 16;
  let y = 20;

  d.setFont('helvetica','bold'); d.setFontSize(16);
  d.text(String(c.oficina_nome||'Orçamento de serviços'), M, y);
  y += 6;
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  [c.oficina_endereco, c.oficina_telefone, c.oficina_doc].filter(Boolean).forEach(l=>{
    d.text(String(l), M, y); y += 4.2;
  });

  d.setDrawColor(210); d.line(M, y+2, 194, y+2); y += 10;

  d.setTextColor(20); d.setFont('helvetica','bold'); d.setFontSize(12);
  d.text('Orçamento nº ' + (o.Numero||'—'), M, y);
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(110);
  d.text(dataBR(o.Data), 194, y, {align:'right'});
  y += 8;

  d.setTextColor(20); d.setFontSize(10);
  d.text('Cliente: ' + (o.ClienteNome||'—'), M, y); y += 5;
  const veic = [o.Modelo, o.Placa, o.Ano, o.Cor].filter(Boolean).join(' · ');
  if (veic){ d.text('Veículo: ' + veic, M, y); y += 5; }
  y += 4;

  // cabeçalho da tabela
  d.setFillColor(20,23,26); d.rect(M, y-5, 178, 8, 'F');
  d.setTextColor(255); d.setFont('helvetica','bold'); d.setFontSize(9);
  d.text('Serviço', M+3, y); d.text('Qtd', 138, y, {align:'right'});
  d.text('Valor', 162, y, {align:'right'}); d.text('Total', 191, y, {align:'right'});
  y += 9;

  d.setTextColor(20); d.setFont('helvetica','normal'); d.setFontSize(10);
  rascunho.itens.forEach(it=>{
    if (y > 258){ d.addPage(); y = 24; }
    const linhas = d.splitTextToSize(String(it.Descricao||''), 112);
    d.text(linhas, M+3, y);
    d.text(String(num(it.Qtd)||1), 138, y, {align:'right'});
    d.text(moeda(it.Valor), 162, y, {align:'right'});
    d.setFont('helvetica','bold');
    d.text(moeda(num(it.Qtd)*num(it.Valor)), 191, y, {align:'right'});
    d.setFont('helvetica','normal');
    y += 6 + (linhas.length-1)*5;
    d.setDrawColor(232); d.line(M, y-3, 194, y-3);
  });

  y += 4;
  if (y > 240){ d.addPage(); y = 24; }
  const linhaTot = (rot, val, forte)=>{
    d.setFont('helvetica', forte?'bold':'normal');
    d.setFontSize(forte?13:10);
    d.text(rot, 150, y, {align:'right'});
    d.text(moeda(val), 191, y, {align:'right'});
    y += forte ? 8 : 5.5;
  };
  linhaTot('Serviços', t.total, false);
  if (t.pago > 0){ linhaTot('Pago', t.pago, false); linhaTot('Saldo', t.saldo, true); }
  else linhaTot('Total', t.total, true);

  if (o.Obs){
    y += 4; d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(90);
    d.text(d.splitTextToSize(String(o.Obs), 178), M, y);
    y += 6;
  }
  const dias = parseInt(c.validade_dias,10);
  if (dias){
    d.setFontSize(9); d.setTextColor(120);
    d.text('Validade deste orçamento: ' + dias + ' dias.', M, 282);
  }
  return d;
}

async function gerarPDF(compartilhar){
  lerCampos(); guardarDescricoes();
  if (!window.jspdf){ aviso('Abra o app conectado à internet uma vez para preparar o PDF', true); return; }
  const o = rascunho.orcamento;
  const nome = `Orcamento-${o.Numero||'novo'}-${(o.Placa||o.ClienteNome||'').replace(/\W+/g,'')}.pdf`;
  const doc = montarPDF();

  if (!compartilhar){ doc.save(nome); return; }

  const blob = doc.output('blob');
  const arq = new File([blob], nome, {type:'application/pdf'});
  const texto = `Olá${o.ClienteNome?' '+String(o.ClienteNome).split(' ')[0]:''}! Segue o orçamento nº ${o.Numero||''} no valor de ${moeda(totais().total)}.`;

  if (navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({ files:[arq], title:nome, text:texto }); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  // sem compartilhamento de arquivo: baixa o PDF e abre a conversa
  doc.save(nome);
  const tel = String(o.Telefone||'').replace(/\D/g,'');
  const numero = tel ? (tel.length<=11 ? '55'+tel : tel) : '';
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(texto+' (arquivo em anexo)'), '_blank');
  aviso('PDF baixado. Anexe na conversa que abriu.');
}

/* ===================== serviços ===================== */
function telaServicos(){
  cabecalho('Serviços','o que aparece no autocompletar');
  let h = `<div class="wrap">
    <button class="btn" onclick="editarServico()">Adicionar serviço</button>`;
  const porCat = {};
  dados.servicos.forEach(s=>{ (porCat[s.Categoria||'Outros'] = porCat[s.Categoria||'Outros']||[]).push(s); });
  Object.keys(porCat).sort().forEach(cat=>{
    h += `<label>${esc(cat)}</label>`;
    porCat[cat].forEach(s=>{
      h += `<button class="srv" onclick='editarServico(${JSON.stringify(s).replace(/'/g,"&#39;")})' style="width:100%;text-align:left">
        <span class="d">${esc(s.Descricao)}</span><span class="v">${moeda(s.ValorPadrao)}</span></button>`;
    });
  });
  tela.innerHTML = h + '</div>';
}

async function editarServico(s){
  s = s || {ID:'',Descricao:'',Categoria:'Funilaria',ValorPadrao:''};
  const desc = prompt('Descrição do serviço:', s.Descricao);
  if (desc===null) return;
  const valor = prompt('Valor padrão (só números):', s.ValorPadrao);
  if (valor===null) return;
  const cat = prompt('Categoria:', s.Categoria||'Funilaria');
  if (cat===null) return;
  try{
    await chamar('salvarServico', { servico:{ID:s.ID, Descricao:desc, Categoria:cat, ValorPadrao:num(valor)} });
    await sincronizar(true); aviso('Serviço salvo'); telaServicos();
  }catch(e){ aviso(e.message, true); }
}

  cabecalho('Ajustes','conexão com a planilha');
  const arq = dados.orcamentos.filter(o=>String(o.Arquivado)==='true').length;
  tela.innerHTML = `<div class="wrap">
    <label for="fApi">Endereço da API (Apps Script)</label>
    <input id="fApi" value="${esc(API)}" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn" onclick="salvarApi()">Salvar e conectar</button>
    <button class="btn sec" onclick="sincronizar()">Baixar dados da planilha</button>
    <div class="tot-box">
      <div class="l"><span>Orçamentos ativos</span><b>${dados.orcamentos.filter(o=>String(o.Arquivado)!=='true').length}</b></div>
      <div class="l"><span>Arquivados</span><b>${arq}</b></div>
      <div class="l"><span>Serviços cadastrados</span><b>${dados.servicos.length}</b></div>
      <div class="l"><span>Clientes</span><b>${dados.clientes.length}</b></div>
    </div>
    <div class="aviso" style="margin-top:14px">Os dados ficam na sua planilha do Google. O app guarda uma cópia no aparelho para funcionar sem internet.</div>

async function salvarApi(){
  API = $('#fApi').value.trim();
  localStorage.setItem('api_url', API);
  await sincronizar();
  ir('painel');
}
