<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Orçamentos — Funilaria</title>
<link rel="manifest" href="manifest.json">
<!-- o iPhone ignora o manifest: precisa destas -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orçamentos">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --ink:#14171A; --steel:#6B7480; --primer:#E9EBEE; --paper:#fff;
  --line:#D5DAE0; --tape:#F5C518; --ok:#1E8E5A; --debt:#C8372D;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--primer);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* topo */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;
}
header h1{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0;flex:1}
header .sub{font-size:12px;font-weight:500;color:#9AA3AE;display:block;letter-spacing:0}
.iconbtn{color:#fff;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:#2A2F36}

main{padding:16px 0 96px}
.wrap{padding:0 16px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 84%;max-width:340px;scroll-snap-align:center}
.colhead{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px}
.colhead b{font-size:14px;font-weight:800}
.colhead span{font-size:12px;color:var(--steel);font-weight:600}
.colhead .bar{height:3px;border-radius:2px;background:var(--ink);flex:1}
.col[data-s="Aguardando pagamento"] .bar{background:var(--debt)}
.col[data-s="Finalizado"] .bar{background:var(--ok)}
.col[data-s="Em execucao"] .bar{background:var(--tape)}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:10px;display:block;width:100%;text-align:left;
}
.card:active{border-color:var(--ink)}
.card .placa{font-size:19px;font-weight:800;letter-spacing:1px}
.card .cli{font-size:13px;color:var(--steel);margin-top:1px}
.card .rod{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
.card .tot{font-size:17px;font-weight:800}
.card .dev{font-size:12px;font-weight:600;color:var(--debt)}
.card .num{font-size:11px;color:var(--steel);font-weight:600}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;color:var(--steel);font-size:13px}

/* formulário */
label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:14px 0 5px}
input,select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,23,26,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* itens */
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.item .top{display:flex;gap:8px;align-items:center}
.item .top input{border:none;padding:4px 0;font-weight:600;background:none}
.item .top input:focus{box-shadow:none}
.item .lin{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;margin-top:8px}
.item .lin input{padding:9px;text-align:right}
.del{width:38px;height:38px;border-radius:var(--r);color:var(--steel);font-size:20px;display:grid;place-items:center}
.foto{margin-top:10px;display:flex;gap:10px;align-items:center}
.foto img{width:64px;height:64px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.fotobtn{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;font-weight:600;color:var(--steel);background:var(--paper)}
.foto-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.foto-acoes .fotobtn{flex:1;min-width:135px}

/* sugestões */
.sug{position:relative}
.sugbox{
  position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--paper);
  border:1px solid var(--ink);border-radius:var(--r);margin-top:4px;overflow:hidden;
  max-height:220px;overflow-y:auto;box-shadow:0 10px 24px rgba(20,23,26,.14)
}
.sugbox button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.sugbox button:last-child{border-bottom:none}
.sugbox button:active{background:var(--primer)}
.sugbox b{font-weight:600}
.sugbox span{color:var(--steel);font-size:13px;white-space:nowrap}

/* totais */
.tot-box{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-top:16px}
.tot-box .l{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#B9C0C8}
.tot-box .l b{color:#fff;font-weight:600}
.tot-box .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #2F353C;margin-top:8px;padding-top:10px}
.tot-box .big span{font-size:13px;color:#B9C0C8}
.tot-box .big b{font-size:24px;font-weight:800}
.saldo-dev{color:#FFB4AC!important}
.saldo-ok{color:#7FD6A8!important}

/* botões */
.btn{display:block;width:100%;padding:15px;border-radius:var(--r);font-weight:700;text-align:center;background:var(--ink);color:#fff;margin-top:10px}
.btn:active{opacity:.85}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.tape{background:var(--tape);color:var(--ink)}
.btn.ghost{background:none;color:var(--debt);font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acoes .btn{margin-top:0}

/* status atual */
.statusbar{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.statusbar b{font-size:14px;flex:1}
.statusbar small{color:var(--steel);font-size:12px}

/* lista serviços */
.srv{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.srv .d{flex:1;font-weight:600;font-size:15px}
.srv .c{font-size:12px;color:var(--steel)}
.srv .v{font-weight:700}

/* barra inferior */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{padding:10px 4px 12px;font-size:11px;font-weight:600;color:var(--steel);display:grid;gap:3px;justify-items:center}
nav button .i{font-size:20px;line-height:1}
nav button[aria-current="true"]{color:var(--ink)}
nav button[aria-current="true"] .i{transform:translateY(-1px)}

/* avisos */
.toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:var(--r);z-index:60;font-size:14px;font-weight:500}
.toast.err{background:var(--debt)}
.hide{display:none!important}
.carregando{text-align:center;color:var(--steel);padding:40px 16px;font-size:14px}
.aviso{background:#FFF6D6;border:1px solid var(--tape);border-radius:var(--r);padding:12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:sobe .18s ease-out}}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}

/* v2: filtros do painel */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip span{opacity:.6;margin-left:4px}
.lista{padding:0 16px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--primer);color:var(--ink);white-space:nowrap}
.pill.s-Aprovado{background:#DCE6F5}
.pill.s-Em{background:#FCEBA6}
.pill.s-Pronto{background:#D9DEE4}
.pill.s-Aguardando{background:#F7D3CF;color:#8E2219}
.pill.s-Finalizado{background:#CFEBDD;color:#145C3B}
.card .linha1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .pago{font-size:12px;font-weight:700;color:var(--ok)}

/* v2: etapas */
.etapas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 6px}
.etapa{height:6px;border-radius:3px;background:var(--line)}
.etapa.feito{background:var(--ink)}
.etapa.atual{background:var(--tape)}
.etapa.espera{background:var(--debt)}
.etapas-rot{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10.5px;color:var(--steel);font-weight:600;margin-bottom:12px}
.etapas-rot .atual{color:var(--ink)}
.proximo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.proximo p{margin:0 0 2px;font-size:13px;color:var(--steel)}
.proximo .btn{margin-top:8px}
.voltar-etapa{display:block;margin:8px auto 0;font-size:13px;color:var(--steel);text-decoration:underline;padding:6px}

/* v2: serviço travado na lista */
.item .top input::placeholder{color:#9AA3AE;font-weight:500}
.sugbox .novo{color:var(--ink);font-weight:700;background:#FFF6D6}
.fotogrande{display:block;width:100%;height:190px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);margin-top:10px;background:var(--primer)}

/* v3: grupos por cliente */
.grupo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-bottom:1px solid var(--line);background:#F7F8F9}
.grupo-cab b{font-size:16px;font-weight:800}
.grupo-cab small{display:block;font-size:12px;color:var(--steel);font-weight:500}
.grupo-cab .aberto{font-size:13px;font-weight:700;color:var(--debt);white-space:nowrap}
.orcrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.orcrow:last-child{border-bottom:none}
.orcrow:active{background:var(--primer)}
.orcrow .pl{font-weight:800;letter-spacing:.5px}
.orcrow .md{font-size:12px;color:var(--steel)}
.orcrow .vl{text-align:right;font-weight:700}
.orcrow .st{text-align:right}
.busca{margin-bottom:12px}
.veic{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.veic-cab{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.veic-cab b{font-size:17px;font-weight:800;letter-spacing:.5px}
.veic-cab small{display:block;color:var(--steel);font-size:12px}
.minibtn{font-size:13px;font-weight:700;padding:8px 12px;border-radius:var(--r);background:var(--tape);white-space:nowrap}

/* v3: caixa */
.recebido{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-top:4px}
.recebido span{font-size:13px;color:#B9C0C8}
.recebido .v{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0 8px}
.recebido .l{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#D5DAE0}
.periodo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pgrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.pgrow b{font-weight:700}
.pgrow small{color:var(--steel);font-size:12px}
.pgrow .vl{text-align:right;font-weight:800;color:var(--ok)}

/* v2: pagamento */
.pgbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px}
.pglin{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pglin:last-of-type{border-bottom:none}
.pglin small{color:var(--steel)}
.formas{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.quitado{display:flex;align-items:center;gap:10px;background:#E4F5EC;border:1px solid #9FD8BA;color:#145C3B;border-radius:var(--r);padding:12px;font-weight:700;margin-top:8px}
.secao{font-size:15px;font-weight:800;margin:22px 0 4px}

/* ============ v5 ============ */

/* folha inferior: substitui confirm/prompt do navegador */
.folha-fundo{position:fixed;inset:0;z-index:60;background:rgba(20,23,26,.45);
  display:flex;align-items:flex-end;justify-content:center;animation:apaga .18s ease}
.folha{background:var(--paper);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  animation:sobe .22s cubic-bezier(.2,.8,.2,1)}
.folha .pega{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.folha h2{font-size:18px;font-weight:800;margin:0 0 4px}
.folha p.exp{margin:0 0 12px;color:var(--steel);font-size:14px}
.folha label:first-of-type{margin-top:6px}
@keyframes sobe{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes apaga{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.folha,.folha-fundo{animation:none}}

/* escolher serviço no toque */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;text-align:left;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.svc:active{border-color:var(--ink);background:var(--primer)}
.svc b{font-size:14px;font-weight:600;line-height:1.25}
.svc span{font-size:13px;font-weight:800;color:var(--steel);margin-top:3px}
.svc.posto{border-color:var(--ok);background:#EDF8F2}
.svc.posto span{color:var(--ok)}
.svc.posto b::before{content:'✓ ';color:var(--ok)}
.contador{position:sticky;bottom:0;background:var(--paper);padding:10px 0 2px;
  border-top:1px solid var(--line);margin-top:10px}

/* placa em primeiro lugar */
.placa-hero input{font-size:26px;font-weight:800;letter-spacing:3px;text-align:center;
  text-transform:uppercase;padding:14px 12px}
.placa-hero input::placeholder{letter-spacing:2px;font-weight:600;color:#B6BCC4}
.achado{display:flex;gap:10px;align-items:center;background:#E4F5EC;border:1px solid #9FD8BA;
  color:#145C3B;border-radius:var(--r);padding:11px 12px;margin-top:10px;font-size:14px}
.achado b{font-weight:800}
details.mais{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
details.mais>summary{list-style:none;cursor:pointer;color:var(--steel);font-size:13px;
  font-weight:700;padding:8px 0;display:flex;justify-content:space-between}
details.mais>summary::-webkit-details-marker{display:none}
details.mais>summary::after{content:'▾'}
details.mais[open]>summary::after{content:'▴'}

/* itens mais enxutos */
.item .desc{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .desc b{font-size:15px;font-weight:600;flex:1;min-width:0}
.item .sub{font-size:17px;font-weight:800;white-space:nowrap}

/* ações direto na linha do painel */
.linha-orc{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.linha-orc:last-child{border-bottom:none}
.linha-orc .orcrow{flex:1;border-bottom:none;min-width:0}
.maisacoes{flex:none;width:44px;color:var(--steel);font-size:20px;font-weight:700;
  border-left:1px solid var(--line);display:grid;place-items:center}
.maisacoes:active{background:var(--primer);color:var(--ink)}

/* fila de envio */
.offline{background:var(--tape);color:var(--ink);font-size:12.5px;font-weight:700;
  text-align:center;padding:7px 16px}
.pill.pendente{background:var(--tape);color:var(--ink)}
</style>
</head>
<body>

<header>
  <button class="iconbtn hide" id="btVoltar" aria-label="Voltar">←</button>
  <h1 id="titulo">Painel<span class="sub" id="subtitulo">orçamentos em andamento</span></h1>
  <button class="iconbtn" id="btSync" aria-label="Atualizar">⟳</button>
</header>

<main id="tela"><div class="carregando">Carregando…</div></main>

<nav>
  <button data-ir="painel" aria-current="true"><span class="i">▦</span>Painel</button>
  <button data-ir="clientes"><span class="i">👤</span>Clientes</button>
  <button data-ir="novo"><span class="i">＋</span>Novo</button>
  <button data-ir="caixa"><span class="i">$</span>Caixa</button>
  <button data-ir="mais"><span class="i">☰</span>Mais</button>
</nav>

<script>
/* ===================== estado ===================== */
// Cole aqui o mesmo ID do cliente OAuth que está no Apps Script (veja SETUP.md).
// Client ID é público por natureza — pode ficar no GitHub. A URL da API, não.
const CLIENT_ID = '415802568647-spdi71hljj8a8778n5a811ukb7hco3ns.apps.googleusercontent.com';

const STATUS = ['Orcamento','Aprovado','Em execucao','Pronto p/ entrega','Aguardando pagamento','Finalizado'];
const ROTULO = {
  'Orcamento':'Orçamento','Aprovado':'Aprovado','Em execucao':'Em execução',
  'Pronto p/ entrega':'Pronto p/ entrega','Aguardando pagamento':'Aguardando pagamento',
  'Finalizado':'Finalizado','Cancelado':'Cancelado'
};
const ETAPAS = [['Orcamento','Orçamento'],['Aprovado','Aprovado'],['Em execucao','Execução'],['Pronto p/ entrega','Pronto'],['Finalizado','Entregue']];
const ANTERIOR = {'Aprovado':'Orcamento','Em execucao':'Aprovado','Pronto p/ entrega':'Em execucao','Aguardando pagamento':'Pronto p/ entrega','Finalizado':'Pronto p/ entrega'};
const FORMAS = ['Pix','Dinheiro','Cartao','Transferencia'];
const FORMA_ROT = {Pix:'Pix',Dinheiro:'Dinheiro',Cartao:'Cartão',Transferencia:'Transferência'};

let API = localStorage.getItem('api_url') || '';
let token = '';                 // id_token do Google, só na memória — nunca no localStorage
let usuario = null;             // { email, nome, papel }
let dados = { config:{}, clientes:[], servicos:[], orcamentos:[], itens:[], pagamentos:[] };
let rascunho = null;
let telaAtual = 'painel';
let filtro = 'Todos';
let pagAberto = false;
let pagForma = 'Pix';
let ocupado = false;
let clienteAtual = '';
let buscaCli = '';
let periodo = 'mes';
let pIni = '', pFim = '';

// As fotos novas ficam somente neste aparelho. A planilha recebe apenas os dados
// do orçamento; o arquivo da imagem é guardado no armazenamento privado do PWA.
const FOTO_DB = 'funilaria-fotos-v1';
const FOTO_STORE = 'fotos';
const FOTO_INDICE = 'fotos_locais_ids';
const FOTO_VAZIA = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
let fotosLocais = new Set((()=>{
  try{ return JSON.parse(localStorage.getItem(FOTO_INDICE)) || []; }
  catch(e){ return []; }
})().map(String));
const urlsFotos = {};

const $ = s => document.querySelector(s);
const tela = $('#tela');

/* ===================== utilidades ===================== */
const num = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
};
const moeda = v => num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje = () => ymd(new Date());
const dataBR = d => { const p=String(d||'').slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : (d||''); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Para texto que vira string JS dentro de onclick="f('…')".
// Aqui NÃO serve &#39;: o HTML decodifica a entidade antes de o JS ser interpretado,
// e o apóstrofo fecha a string. Tem que ir escapado com barra invertida mesmo.
const escJs = s => String(s==null?'':s)
  .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')
  .replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Objeto que vira argumento dentro de onclick='f({...})'.
// As aspas que delimitam o JSON podem ficar (o atributo é delimitado por apóstrofo).
// O que precisa sair é: aspa DENTRO do texto (o JSON já a deixou como \"), o apóstrofo
// (fecharia o atributo) e & < > (viram entidade ou tag). Tudo isso vira \uXXXX, que
// atravessa o parser de HTML e continua sendo string válida em JS.
const jsonAttr = o => JSON.stringify(o)
  .replace(/\\"/g, '\\u0022')
  .replace(/[&<>']/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0'));
const id = p => p + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*1000).toString(36).toUpperCase();
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pillClasse = s => 's-' + String(s||'').split(' ')[0];

// Links do Drive viram miniatura que o navegador consegue exibir
function driveId(url){
  const m = String(url||'').match(/[?&]id=([\w-]+)/) || String(url||'').match(/\/d\/([\w-]+)/);
  return m ? m[1] : '';
}
function fotoSrc(url){
  if (!url || String(url).startsWith('data:')) return url;
  const i = driveId(url);
  return i ? `https://drive.google.com/thumbnail?id=${i}&sz=w1000` : url;
}
function fotoAbrir(url){
  if (!url || String(url).startsWith('data:')) return;
  const i = driveId(url);
  window.open(i ? `https://drive.google.com/file/d/${i}/view` : url, '_blank');
}
function fotoErro(img){
  const i = driveId(img.dataset.url);
  if (i && !img.dataset.tentou){ img.dataset.tentou = 1; img.src = `https://lh3.googleusercontent.com/d/${i}=w1000`; }
}

function salvarIndiceFotos(){
  try{ localStorage.setItem(FOTO_INDICE, JSON.stringify([...fotosLocais])); }catch(e){}
}
function bancoFotos(){
  return new Promise((ok, falha)=>{
    if (!window.indexedDB){ falha(new Error('Este navegador não oferece armazenamento local de fotos.')); return; }
    const req = indexedDB.open(FOTO_DB, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if (!db.objectStoreNames.contains(FOTO_STORE)) db.createObjectStore(FOTO_STORE, {keyPath:'id'});
    };
    req.onsuccess = ()=> ok(req.result);
    req.onerror = ()=> falha(req.error || new Error('Não foi possível abrir o armazenamento de fotos.'));
  });
}
async function guardarFotoLocal(itemId, blob){
  const sid = String(itemId);
  const db = await bancoFotos();
  try{
    await new Promise((ok, falha)=>{
      const tx = db.transaction(FOTO_STORE, 'readwrite');
      tx.objectStore(FOTO_STORE).put({id:sid, blob, quando:Date.now()});
      tx.oncomplete = ok;
      tx.onerror = ()=> falha(tx.error || new Error('Não foi possível guardar a foto.'));
    });
  } finally {
    db.close();     // no finally: conexão pendurada impede futuras versões do banco
  }
  fotosLocais.add(sid); salvarIndiceFotos();
  if (urlsFotos[sid]) URL.revokeObjectURL(urlsFotos[sid]);
  urlsFotos[sid] = URL.createObjectURL(blob);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
async function buscarFotoLocal(itemId){
  const sid = String(itemId);
  const db = await bancoFotos();
  let reg;
  try{
    reg = await new Promise((ok, falha)=>{
      const req = db.transaction(FOTO_STORE, 'readonly').objectStore(FOTO_STORE).get(sid);
      req.onsuccess = ()=>ok(req.result || null);
      req.onerror = ()=>falha(req.error || new Error('Não foi possível ler a foto.'));
    });
  } finally {
    db.close();
  }
  if (!reg){ fotosLocais.delete(sid); salvarIndiceFotos(); }
  return reg && reg.blob ? reg.blob : null;
}
async function apagarFotoLocal(itemId){
  const sid = String(itemId);
  const db = await bancoFotos();
  try{
    await new Promise((ok, falha)=>{
      const tx = db.transaction(FOTO_STORE, 'readwrite');
      tx.objectStore(FOTO_STORE).delete(sid);
      tx.oncomplete = ok;
      tx.onerror = ()=>falha(tx.error || new Error('Não foi possível apagar a foto.'));
    });
  } finally {
    db.close();
  }
  fotosLocais.delete(sid); salvarIndiceFotos();
  if (urlsFotos[sid]){ URL.revokeObjectURL(urlsFotos[sid]); delete urlsFotos[sid]; }
}
const temFotoLocal = itemId => fotosLocais.has(String(itemId));
const temFoto = it => !!(it && (temFotoLocal(it.ID) || it.FotoURL));

async function urlFotoLocal(itemId){
  const sid = String(itemId);
  if (urlsFotos[sid]) return urlsFotos[sid];
  const blob = await buscarFotoLocal(sid);
  if (!blob) return '';
  return (urlsFotos[sid] = URL.createObjectURL(blob));
}
async function carregarFotosLocaisNaTela(){
  const imgs = [...document.querySelectorAll('img[data-foto-local]')];
  await Promise.all(imgs.map(async img=>{
    try{
      const url = await urlFotoLocal(img.dataset.fotoLocal);
      if (url && document.body.contains(img)) img.src = url;
    }catch(e){ img.alt = 'Foto indisponível neste aparelho'; }
  }));
}
async function verFotoLocal(itemId){
  try{
    const url = await urlFotoLocal(itemId);
    if (!url){ aviso('Esta foto não está mais neste aparelho', true); return; }
    await folha({
      titulo:'Foto do serviço',
      corpo:`<img src="${esc(url)}" alt="Foto do serviço" style="display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:var(--r);background:var(--ink)">`,
      botoes:[{rot:'Fechar',valor:true,classe:'sec'}]
    });
  }catch(e){ aviso('Não consegui abrir a foto', true); }
}
function nomeArquivoFoto(desc){
  const base = semAcento(desc||'foto').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45) || 'foto';
  return `${base}-${hoje()}.jpg`;
}
async function salvarFotoNoAparelho(itemId, desc){
  try{
    const blob = await buscarFotoLocal(itemId);
    if (!blob){ aviso('Esta foto não está mais neste aparelho', true); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nomeArquivoFoto(desc); a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    aviso('Cópia da foto preparada para salvar');
  }catch(e){ aviso('Não consegui salvar uma cópia da foto', true); }
}
async function removerFoto(ix){
  const it = rascunho.itens[ix]; if (!it) return;
  if (!(await confirmar('Remover foto', 'A foto deixa de aparecer neste orçamento.', 'Remover', true))) return;
  try{
    if (temFotoLocal(it.ID)) await apagarFotoLocal(it.ID);
    it.FotoURL = '';
    delete it._novaFoto;
    guardarRascunho(); telaEditor(); aviso('Foto removida');
  }catch(e){ aviso('Não consegui remover a foto', true); }
}
function base64ParaBlob(base64, mime){
  const bin = atob(base64), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type:mime||'image/jpeg'});
}
async function migrarFotosLegadas(itens){
  for (const it of (itens||[])){
    if (!it._novaFoto) continue;
    await guardarFotoLocal(it.ID, base64ParaBlob(it._novaFoto, 'image/jpeg'));
    it.FotoURL = '';
    delete it._novaFoto;
  }
}
function blobParaDataURL(blob){
  return new Promise((ok, falha)=>{
    const r = new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>falha(r.error); r.readAsDataURL(blob);
  });
}

/* ===================== folha inferior ===================== */
// Substitui confirm/prompt do navegador: em PWA instalado eles ficam feios,
// e em alguns contextos o prompt simplesmente não abre.
function folha({ titulo, texto, corpo, botoes, aoAbrir }){
  return new Promise(resolve=>{
    fecharSug();
    const fundo = document.createElement('div');
    fundo.className = 'folha-fundo';
    fundo.innerHTML = `<div class="folha" role="dialog" aria-modal="true" aria-label="${esc(titulo||'')}">
      <div class="pega"></div>
      ${titulo?`<h2>${esc(titulo)}</h2>`:''}
      ${texto?`<p class="exp">${esc(texto)}</p>`:''}
      ${corpo||''}
      <div id="folhaBotoes"></div>
    </div>`;

    let respondido = false;
    const fechar = v =>{
      if (respondido) return;
      respondido = true;
      document.removeEventListener('keydown', aoTeclar);
      fundo.remove();
      resolve(v);
    };
    const aoTeclar = e =>{ if (e.key === 'Escape') fechar(null); };

    const caixa = fundo.querySelector('#folhaBotoes');
    (botoes || [{ rot:'Fechar', valor:null, classe:'sec' }]).forEach(b=>{
      const bt = document.createElement('button');
      bt.className = 'btn ' + (b.classe || '');
      bt.textContent = b.rot;
      bt.onclick = ()=>{
        // um botão pode validar antes de fechar; devolver undefined cancela o fechamento
        const v = typeof b.valor === 'function' ? b.valor(fundo) : b.valor;
        if (v !== undefined) fechar(v);
      };
      caixa.appendChild(bt);
    });

    fundo.addEventListener('click', e=>{ if (e.target === fundo) fechar(null); });
    document.addEventListener('keydown', aoTeclar);
    document.body.appendChild(fundo);
    ligarMascaras(fundo);
    if (aoAbrir) aoAbrir(fundo);
    // não puxa o teclado à força em folha de escolha; só quando há campo de texto a preencher
    const primeiro = fundo.querySelector('input:not(.busca),textarea');
    if (primeiro) setTimeout(()=>primeiro.focus(), 120);
  });
}

const confirmar = (titulo, texto, rotulo, perigo) => folha({
  titulo, texto,
  botoes: [ { rot: rotulo || 'Confirmar', valor: true, classe: perigo ? 'tape' : '' },
            { rot: 'Cancelar', valor: false, classe: 'sec' } ]

/* ===================== máscaras ===================== */
// Digita 38000 e aparece 380,00 — evita o erro de ponto no lugar errado.
function mascaraMoeda(el){
  const aplica = avisar =>{
    const d = el.value.replace(/\D/g,'').slice(0,11);
    el.value = d ? (Number(d)/100).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}) : '';
    // o cursor fica sempre no fim: é o comportamento certo para máscara de centavos
    const f = el.value.length;
    try{ el.setSelectionRange(f,f); }catch(e){}
    // avisa quem acompanha o campo SÓ depois de formatar. Se o modelo lesse o valor
    // durante a digitação, pegaria o número antes da máscara: digitar 38000 gravava 38.
    if (avisar && el._aoMudar) el._aoMudar(el.value);
  };
  el.setAttribute('inputmode','numeric');
  el.addEventListener('input', ()=> aplica(true));
  if (el.value) aplica(false);
}

function formatarTel(v){
  const d = String(v||'').replace(/\D/g,'').slice(0,11);
  if (d.length <= 2) return d;
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function mascaraTel(el){
  // Só formata o que a pessoa digitar. Não mexe no valor que já veio da planilha:
  // registros antigos podem estar como 5569999999999 (com o 55), e reformatar
  // truncaria o número na hora de salvar.
  el.addEventListener('input', ()=>{
    el.value = formatarTel(el.value);
    const f = el.value.length;
    try{ el.setSelectionRange(f,f); }catch(e){}
  });
}

function mascaraPlaca(el){
  el.addEventListener('input', ()=>{
    el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);
  });
}

// Liga as máscaras pelo nome da classe, para qualquer trecho recém-inserido no DOM.
function ligarMascaras(raiz){
  (raiz || document).querySelectorAll('.moeda:not([data-msk])').forEach(el=>{ el.dataset.msk=1; mascaraMoeda(el); });
  (raiz || document).querySelectorAll('.tel:not([data-msk])').forEach(el=>{ el.dataset.msk=1; mascaraTel(el); });
  (raiz || document).querySelectorAll('.placa:not([data-msk])').forEach(el=>{ el.dataset.msk=1; mascaraPlaca(el); });
}

function aviso(msg, erro){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), erro ? 5000 : 2800);
}

/* ===================== login com conta Google ===================== */
let tokenExp = 0;
let esperandoToken = null;

const gisPronto = () => !!(window.google && google.accounts && google.accounts.id);
// O token do Google é um JWT (três partes); o da sessão por código é texto opaco.
const ehTokenGoogle = t => String(t||'').split('.').length === 3;
const tokenValido = () => !!token && tokenExp - 60000 > Date.now();
const ehDono = () => !!usuario && usuario.papel === 'dono';

function iniciarGIS(){
  if (!CLIENT_ID || !gisPronto() || iniciarGIS.feito) return gisPronto() && !!CLIENT_ID;
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: r => receberToken(r.credential),
    auto_select: true,
    cancel_on_tap_outside: false
  });
  iniciarGIS.feito = true;
  return true;
}

function receberToken(cred){
  token = cred;
  try{
    const c = JSON.parse(atob(cred.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    tokenExp = Number(c.exp) * 1000;
  }catch(e){ tokenExp = Date.now() + 50*60*1000; }
  if (esperandoToken){ const f = esperandoToken; esperandoToken = null; f(true); }
  else entrar();
}

async function entrar(){
  await sincronizar();
  if (!usuario) return;
  ir('painel');
  pintarAvisoFila();
  await esvaziarFila(true);           // manda o que ficou pendente do uso sem internet
  await ofereceRascunho();            // e retoma um preenchimento interrompido
}

// Tenta renovar sem incomodar o usuário. Se não der, cai na tela de login.
function renovarToken(){
  return new Promise(ok=>{
    if (!iniciarGIS()) return ok(false);
    const t = setTimeout(()=>{ esperandoToken = null; ok(false); }, 4000);
    esperandoToken = v =>{ clearTimeout(t); ok(v); };
    try{ google.accounts.id.prompt(); }catch(e){ clearTimeout(t); esperandoToken=null; ok(false); }
  });
}

async function sair(){
  // avisa o servidor para a sessão deixar de valer de verdade, não só neste aparelho
  if (token && !ehTokenGoogle(token)){
    try{ await chamar('sair', { token }); }catch(e){}
  }
  token = ''; tokenExp = 0; usuario = null;
  etapaLogin = 'email';
  dados = { config:{}, clientes:[], servicos:[], orcamentos:[], itens:[], pagamentos:[] };
  localStorage.removeItem('cache');
  localStorage.removeItem('sessao');
  try{ if (gisPronto()) google.accounts.id.disableAutoSelect(); }catch(e){}
  telaAtual = 'login';
  telaLogin();
  aviso('Você saiu da conta');
}

      <span style="font-size:13px">Ele vale por 10 minutos.</span>
    </div>
    <label for="lgCodigo">Código de 6 dígitos</label>
    <input id="lgCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"
           style="font-size:30px;font-weight:800;letter-spacing:10px;text-align:center;padding:14px">
    <button class="btn" id="btEntrar" onclick="confirmarCodigo()">Entrar</button>
    <button class="btn sec" onclick="enviarCodigo(true)">Enviar outro código</button>
    <button class="btn ghost" onclick="etapaLogin='email';telaLogin()">Usar outro e-mail</button>
  </div>`;

  const c = $('#lgCodigo');
  c.addEventListener('input', ()=>{
    c.value = c.value.replace(/\D/g,'').slice(0,6);
    if (c.value.length === 6) confirmarCodigo();     // entra sozinho ao completar
  });
  setTimeout(()=>c.focus(), 150);
}

async function enviarCodigo(denovo){
  const campo = $('#lgEmail');
  const email = ((campo ? campo.value : emailLogin) || '').trim().toLowerCase();
  if (!email || email.indexOf('@') < 0){ aviso('Informe um e-mail válido', true); return; }
  if (!API){ aviso('Configure o endereço da API primeiro', true); ir('ajustes'); return; }

  const bt = $('#btCodigo') || $('#btEntrar');
  if (bt) bt.disabled = true;
  aviso(denovo ? 'Enviando outro código…' : 'Enviando código…');
  try{
    await semLogin('pedirCodigo', { email });
    emailLogin = email;
    localStorage.setItem('ultimo_email', email);
    etapaLogin = 'codigo';
    telaLogin();
    aviso('Se esse e-mail tiver acesso, o código chegou. Confira também o spam.');
  }catch(e){
    aviso(e.message, true);
  }finally{ if (bt) bt.disabled = false; }
}

async function confirmarCodigo(){
  const c = $('#lgCodigo');
  const codigo = (c ? c.value : '').replace(/\D/g,'');
  if (codigo.length !== 6) return;
  const bt = $('#btEntrar');
  if (bt) bt.disabled = true;
  try{
    const r = await semLogin('entrarComCodigo', {
      email: emailLogin, codigo, aparelho: navigator.userAgent.slice(0,80) });
    token = r.token;
    tokenExp = Date.now() + 365*86400000;     // a validade real quem controla é o servidor
    localStorage.setItem('sessao', r.token);
    usuario = r.usuario;
    etapaLogin = 'email';
    await entrar();
  }catch(e){
    aviso(e.message, true);
    if (c){ c.value=''; c.focus(); }
    if (bt) bt.disabled = false;
  }
}

/* ===================== chamadas à API ===================== */

// Chamada que não exige sessão: só pedirCodigo e entrarComCodigo passam por aqui.
async function semLogin(action, corpo){
  if (!API) throw new Error('Configure o endereço da API em Ajustes');
  let j;
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, corpo||{}))
    });
    j = await r.json();
  }catch(falha){
    const e = new Error('Sem conexão com a planilha agora');
    e.codigo = 'REDE'; throw e;
  }
  if (!j.ok){
    const e = new Error(j.error || 'Falha na API');
    e.codigo = j.codigo || 'ERRO';
    throw e;
  }
  return j.data;
}

async function chamar(action, corpo){
  if (!API) throw new Error('Configure o endereço da API em Ajustes');
  // Sessão por código não expira no aparelho: quem decide é o servidor.
  // Só o login do Google precisa renovar o token de tempos em tempos.
  if (!token && !(await renovarToken())){
    const e = new Error('Entre para continuar');
    e.codigo = 'NAO_AUTORIZADO'; throw e;
  }
  if (ehTokenGoogle(token) && !tokenValido() && !(await renovarToken())){
    const e = new Error('Login do Google expirou. Entre de novo.');
    e.codigo = 'NAO_AUTORIZADO'; throw e;
  }
  let j;
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action, token}, corpo||{}))
    });
    j = await r.json();
  }catch(falha){
    // sem internet, DNS, timeout: marcado para a fila saber que vale tentar depois
    const e = new Error('Sem conexão com a planilha agora');
    e.codigo = 'REDE';
    throw e;
  }
  if (!j.ok){
    const e = new Error(j.error || 'Falha na API');
    e.codigo = j.codigo || 'ERRO';
    throw e;
  }
  return j.data;
}

/* ===================== fila de envio (sem internet) ===================== */
// Só orçamento NOVO entra na fila. Alterar um que já existe depende da versão atual
// da planilha, e pagamento repetido é dinheiro errado — essas duas coisas exigem
// internet na hora, e o app diz isso em vez de fingir que gravou.
const semRede = () => navigator.onLine === false;
const ehFalhaDeRede = e => !e.codigo || e.codigo === 'REDE';

function lerFila(){
  try{ return JSON.parse(localStorage.getItem('fila')) || []; }catch(e){ return []; }
}
function gravarFila(f){
  try{ localStorage.setItem('fila', JSON.stringify(f)); }
  catch(e){ aviso('Memória do aparelho cheia: envie os orçamentos pendentes.', true); }
}
const totalFila = () => lerFila().length;

function enfileirar(corpo){
  const f = lerFila();
  f.push(Object.assign({ chaveIdem: id('K'), criadoEm: Date.now() }, corpo));
  gravarFila(f);
  pintarAvisoFila();
}

// Reenvia o que está pendente. Idempotente: a chaveIdem impede duplicata.
let enviandoFila = false;
async function esvaziarFila(silencioso){
  if (enviandoFila || !API || !usuario) return;
  let f = lerFila();
  if (!f.length) return;
  enviandoFila = true;
  let enviados = 0, repetidos = 0;
  try{
    while (f.length){
      const item = f[0];
      try{
        // Versões antigas da fila guardavam a foto em base64. Migra para o
        // armazenamento privado deste aparelho e nunca envia o arquivo ao Drive.
        for (const it of (item.itens || [])){
          if (it._novaFoto){
            await guardarFotoLocal(it.ID, base64ParaBlob(it._novaFoto, 'image/jpeg'));
            it.FotoURL = '';
            delete it._novaFoto;
            gravarFila(f);
          }
          if (temFotoLocal(it.ID) || String(it.FotoURL||'').startsWith('data:')) it.FotoURL = '';
        }
        const r = await chamar('salvarOrcamento', {
          orcamento: item.orcamento, itens: item.itens, chaveIdem: item.chaveIdem });
        if (r && r.repetido) repetidos++; else enviados++;
        f.shift();
        gravarFila(f);
      }catch(e){
        if (ehFalhaDeRede(e)) break;                    // ainda sem internet: tenta depois
        if (e.codigo === 'NAO_AUTORIZADO'){ await tratar(e); break; }
        // recusado por regra (dado inválido, por ex.): tirar da fila, senão trava para sempre
        f.shift(); gravarFila(f);
        aviso('Um orçamento pendente foi recusado: ' + e.message, true);
      }
    }
  } finally {
    enviandoFila = false;
    pintarAvisoFila();
  }
  if (enviados || repetidos){
    await sincronizar(true);
    if (!silencioso || enviados){
      aviso(enviados
        ? enviados + ' orçamento(s) enviado(s) para a planilha'
        : 'Os pendentes já estavam na planilha');
    }
    render();
  }
}

function pintarAvisoFila(){
  const n = totalFila();
  let barra = $('#barraFila');
  if (!n){ if (barra) barra.remove(); return; }
  if (!barra){
    barra = document.createElement('div');
    barra.id = 'barraFila';
    barra.className = 'offline';
    document.querySelector('header').after(barra);
  }
  barra.innerHTML = `${n} orçamento(s) esperando internet · <u>enviar agora</u>`;
  barra.onclick = ()=> esvaziarFila();
}

window.addEventListener('online', ()=>{ aviso('Conexão de volta'); esvaziarFila(true); });
window.addEventListener('offline', ()=> aviso('Sem internet. Orçamentos novos ficam guardados no aparelho.', true));

// Sessão caiu (expirou, foi encerrada pelo dono, acesso desativado): volta ao login
// e descarta a cópia local, para não deixar dado de orçamento em aparelho sem acesso.
function perderSessao(motivo){
  token = ''; tokenExp = 0; usuario = null;
  etapaLogin = 'email';
  dados = { config:{}, clientes:[], servicos:[], orcamentos:[], itens:[], pagamentos:[] };
  localStorage.removeItem('sessao');
  localStorage.removeItem('cache');
  telaAtual = 'login';
  telaLogin(motivo);
}

// Trata de forma única os erros que exigem uma reação e não só um aviso.
async function tratar(e){
  if (e.codigo === 'NAO_AUTORIZADO'){ perderSessao(e.message); return true; }
  if (e.codigo === 'CONFLITO'){
    aviso(e.message, true);
    const ativo = rascunho && rascunho.orcamento && rascunho.orcamento.ID;
    await sincronizar(true);
    if (ativo) abrir(ativo); else render();
    return true;
  }
  aviso(e.message, true);
  return false;
}

// O cache local é só para abrir rápido; some ao sair da conta.
function salvarCache(){ try{ localStorage.setItem('cache', JSON.stringify(dados)); }catch(e){} }
function lerCache(){
  try { const c = JSON.parse(localStorage.getItem('cache')); if (c && c.orcamentos) dados = c; } catch(e){}
}

async function sincronizar(silencioso){
  if (!API) return;
  try{
    const d = await chamar('carregar', { incluirArquivados:true });
    dados = d;
    usuario = d.usuario || null;
    salvarCache();
    if (!silencioso){ aviso('Dados atualizados'); render(); }
  }catch(e){
    if (e.codigo === 'NAO_AUTORIZADO'){ perderSessao(e.message); return; }
    if (!silencioso) aviso(e.message, true);
  }
}

/* ===================== navegação ===================== */
const ABA = {painel:'painel',clientes:'clientes',cliente:'clientes',novo:'novo',caixa:'caixa',
  mais:'mais',servicos:'mais',ajustes:'mais',usuarios:'mais',log:'mais',editor:'',login:''};
function ir(t, arg){
  telaAtual = t;
  pagAberto = false;
  const aba = ABA[t]===undefined ? '' : ABA[t];
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.ir===aba ? 'true':'false'));
  $('#btVoltar').classList.toggle('hide', t==='painel');
  if (t==='novo'){ rascunho = novoRascunho(arg); telaAtual='editor'; }
  if (t==='editor' && arg) rascunho = arg;
  if (t==='cliente' && arg) clienteAtual = arg;
  render();
  window.scrollTo(0,0);
}
$('#btVoltar').onclick = ()=> ir('painel');
$('#btSync').onclick = async ()=>{ await sincronizar(); };
document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> ir(b.dataset.ir));

function cabecalho(t, s){ $('#titulo').childNodes[0].nodeValue = t; $('#subtitulo').textContent = s; }

function render(){
  // sem login válido nada é exibido, nem a partir do cache local
  if (!usuario && telaAtual!=='ajustes'){ telaAtual='login'; telaLogin(); return; }
  if (telaAtual==='login') telaLogin();
  else if (telaAtual==='painel') telaPainel();
  else if (telaAtual==='editor') telaEditor();
  else if (telaAtual==='servicos') telaServicos();
  else if (telaAtual==='clientes') telaClientes();
  else if (telaAtual==='cliente') telaCliente();
  else if (telaAtual==='caixa') telaCaixa();
  else if (telaAtual==='mais') telaMais();
  else if (telaAtual==='usuarios') telaUsuarios();
  else if (telaAtual==='log') telaLog();
  else if (telaAtual==='ajustes') telaAjustes();
}

/* ===================== painel ===================== */
function telaPainel(){
  cabecalho('Painel','orçamentos em andamento');
  const ativos = dados.orcamentos.filter(o => String(o.Arquivado)!=='true');

  if (!API){
    tela.innerHTML = `<div class="wrap">
      <div class="aviso">Antes de usar, informe o endereço da API em <b>Ajustes</b>. É o link que o Apps Script gerou ao publicar.</div>
      <button class="btn" onclick="ir('ajustes')">Abrir ajustes</button></div>`;
    return;
  }
  // orçamentos feitos sem internet, ainda no aparelho
  const fila = lerFila();
  const blocoFila = fila.length ? `<div class="wrap"><div class="secao" style="margin-top:0">Esperando internet</div>` +
    fila.map(q=>{
      const t = (q.itens||[]).reduce((s,i)=> s + num(i.Qtd)*num(i.Valor), 0);
      return `<div class="grupo"><div class="orcrow" style="cursor:default">
        <div><span class="pl">${esc(q.orcamento.Placa||'sem placa')}</span>
          <span class="md">${esc(q.orcamento.ClienteNome||'')}</span></div>
        <div class="vl">${moeda(t)}</div>
        <div><span class="pill pendente">no aparelho</span></div>
        <div class="st"></div></div></div>`;
    }).join('') +
    `<button class="btn sec" onclick="esvaziarFila()">Enviar agora</button></div>` : '';

  if (!ativos.length){
    tela.innerHTML = blocoFila + `<div class="wrap"><div class="vazio">Nenhum orçamento em andamento.<br>Toque em <b>Novo</b> para criar o primeiro.</div></div>`;
    return;
  }

  const conta = s => ativos.filter(o=>o.Status===s).length;
  if (filtro!=='Todos' && !conta(filtro)) filtro = 'Todos';
  let h = blocoFila + '<div class="chips">';
  h += `<button class="chip" aria-pressed="${filtro==='Todos'}" onclick="filtrar('Todos')">Todos<span>${ativos.length}</span></button>`;
  STATUS.forEach(s=>{
    const n = conta(s); if (!n) return;
    h += `<button class="chip" aria-pressed="${filtro===s}" onclick="filtrar('${s}')">${ROTULO[s]}<span>${n}</span></button>`;
  });
  h += '</div><div class="lista">';

  const lista = filtro==='Todos' ? ativos : ativos.filter(o=>o.Status===filtro);
  const grupos = {};
  lista.forEach(o=>{
    const k = chaveCli(o);
    (grupos[k] = grupos[k] || {chave:k, nome:o.ClienteNome||'Sem nome', orcs:[]}).orcs.push(o);
  });
  Object.values(grupos)
    .sort((x,y)=> ultima(y.orcs).localeCompare(ultima(x.orcs)))
    .forEach(g=>{
      const aberto = g.orcs.reduce((s,o)=> s + (o.Status!=='Orcamento' ? Math.max(0,num(o.Saldo)) : 0), 0);
      const placas = new Set(g.orcs.map(o=>String(o.Placa||'').toUpperCase())).size;
      h += `<div class="grupo">
        <button class="grupo-cab" onclick="ir('cliente','${escJs(g.chave)}')">
          <div><b>${esc(g.nome)}</b><small>${placas} ${placas>1?'carros':'carro'} · ${g.orcs.length} ${g.orcs.length>1?'orçamentos':'orçamento'}</small></div>
          ${aberto>0?`<span class="aberto">falta ${moeda(aberto)}</span>`:''}
        </button>`;
      g.orcs.sort((x,y)=>String(y.AtualizadoEm||'').localeCompare(String(x.AtualizadoEm||''))).forEach(o=>{
        const cobrar = num(o.ValorCobrado) > 0 ? num(o.ValorCobrado) : num(o.Total);
        h += `<div class="linha-orc">
          <button class="orcrow" onclick="abrir('${escJs(o.ID)}')">
            <div><span class="pl">${esc(o.Placa||'sem placa')}</span> <span class="md">${esc(o.Modelo||'')} · nº ${esc(o.Numero)}</span></div>
            <div class="vl">${moeda(cobrar)}</div>
            <div><span class="pill ${pillClasse(o.Status)}">${ROTULO[o.Status]||o.Status}</span></div>
            <div class="st">${cobrar>0&&num(o.Saldo)<=0?'<span class="pago">Pago</span>':num(o.Pago)>0?`<span class="dev">falta ${moeda(o.Saldo)}</span>`:''}</div>
          </button>
          <button class="maisacoes" onclick="acoesDoOrcamento('${escJs(o.ID)}')" aria-label="Ações do orçamento ${esc(o.Numero)}">⋮</button>
        </div>`;
      });
      h += `</div>`;
    });
  tela.innerHTML = h + '</div>';
}
function filtrar(s){ filtro = s; telaPainel(); }

// Ações sem precisar abrir o orçamento. As regras são as mesmas de dentro dele.
async function acoesDoOrcamento(oid){
  const o = dados.orcamentos.find(x=>String(x.ID)===String(oid));
  if (!o) return;
  const pago = num(o.Pago) !== 0;
  const botoes = [{ rot:'Abrir orçamento', valor:'abrir' }];

  if (String(o.Arquivado)==='true') botoes.push({ rot:'Trazer de volta ao painel', valor:'desarquivar', classe:'sec' });
  else botoes.push({ rot:'Arquivar (tirar do painel)', valor:'arquivar', classe:'sec' });

  if (ehDono() && !pago && o.Status!=='Cancelado'){
    botoes.push({ rot:'Cancelar orçamento', valor:'cancelar', classe:'ghost' });
  }
  botoes.push({ rot:'Fechar', valor:null, classe:'sec' });

  const motivo = pago
    ? 'Tem pagamento lançado: para cancelar, estorne antes, dentro do orçamento.'
    : (!ehDono() ? 'Só o dono pode cancelar um orçamento.' : '');

  const escolha = await folha({
    titulo: `${o.Placa||'sem placa'} · nº ${o.Numero}`,
    texto: `${o.ClienteNome||'sem cliente'} — ${ROTULO[o.Status]||o.Status}${motivo?'\n'+motivo:''}`,
    botoes
  });
  if (!escolha) return;
  if (escolha === 'abrir'){ abrir(oid); return; }

  // as ações reaproveitam o fluxo do editor, com as mesmas confirmações
  abrir(oid);
  if (escolha === 'arquivar') await arquivarOrc();
  else if (escolha === 'desarquivar') await desarquivarOrc();
  else if (escolha === 'cancelar') await cancelarOrc();
}

function abrir(oid){
  const o = dados.orcamentos.find(x=>String(x.ID)===String(oid));
  if (!o) return;
  ir('editor', {
    orcamento: Object.assign({}, o),
    itens: dados.itens.filter(i=>String(i.OrcamentoID)===String(oid))
             .sort((a,b)=>num(a.Ordem)-num(b.Ordem)).map(i=>Object.assign({},i)),
    pagamentos: dados.pagamentos.filter(p=>String(p.OrcamentoID)===String(oid)).map(p=>Object.assign({},p))
  });
}

function novoRascunho(pref){
  return {
    orcamento:Object.assign({ ID:'', Numero:'', Data:hoje(), ClienteID:'', ClienteNome:'', Telefone:'', Placa:'', Modelo:'', Ano:'', Cor:'', Status:'Orcamento', Obs:'', Arquivado:false, Versao:0 }, pref||{}),
    // começa vazio: os serviços entram por toque, sem linha em branco para preencher
    itens:[],
    pagamentos:[]
  };
}

/* ===================== editor ===================== */
function totais(){
  const total = rascunho.itens.reduce((s,i)=> s + num(i.Qtd)*num(i.Valor), 0);
  const pago  = rascunho.pagamentos.reduce((s,p)=> s + num(p.Valor), 0);
  // o que o cliente paga é o valor fechado, quando existe
  const cobrado = num(rascunho.orcamento.ValorCobrado);
  const aCobrar = cobrado > 0 ? cobrado : total;
  return { total, pago, cobrado, aCobrar, desconto: total - aCobrar, saldo: aCobrar - pago };
}

function blocoEtapas(o, t){
  const espera = o.Status==='Aguardando pagamento';
  const atual = espera ? 4 : ETAPAS.findIndex(e=>e[0]===o.Status);
  let h = '<div class="etapas">';
  ETAPAS.forEach((e,i)=>{
    const cl = i<atual ? 'feito' : i===atual ? (espera ? 'espera' : (o.Status==='Finalizado' ? 'feito' : 'atual')) : '';
    h += `<i class="etapa ${cl}"></i>`;
  });
  h += '</div><div class="etapas-rot">';
  ETAPAS.forEach((e,i)=> h += `<span class="${i===atual?'atual':''}">${e[1]}</span>`);
  h += '</div>';

  let titulo = '', btn = '';
  if (o.Status==='Orcamento'){
    titulo='Aguardando o cliente aprovar';
    btn=`<button class="btn" onclick="avancar('Aprovado')">Cliente aprovou</button>
         <button class="btn sec" onclick="arquivarOrc()">Cliente não fechou · arquivar</button>`;
  }
  else if (o.Status==='Aprovado'){ titulo='Aprovado, serviço ainda não começou'; btn=`<button class="btn" onclick="avancar('Em execucao')">Iniciar serviço</button>`; }
  else if (o.Status==='Em execucao'){ titulo='Carro em serviço'; btn=`<button class="btn" onclick="avancar('Pronto p/ entrega')">Serviço pronto</button>`; }
  else if (o.Status==='Pronto p/ entrega'){
    titulo = t.saldo>0 ? `Pronto. Ainda falta receber ${moeda(t.saldo)}` : 'Pronto e pago';
    btn = t.saldo>0
      ? `<button class="btn" onclick="avancar('Finalizado')">Entregar sem receber tudo</button>
         <button class="btn tape" onclick="abrirPag()">Receber pagamento</button>`
      : `<button class="btn" onclick="avancar('Finalizado')">Entregar e finalizar</button>`;
  }
  else if (espera){ titulo=`Carro entregue. Falta receber ${moeda(t.saldo)}`; btn=`<button class="btn tape" onclick="abrirPag()">Receber pagamento</button>`; }
  else if (o.Status==='Finalizado'){ titulo='Serviço entregue e pago'; btn=`<button class="btn sec" onclick="arquivarOrc()">Arquivar (tirar do painel)</button>`; }

  if (String(o.Arquivado)==='true' && o.Status!=='Cancelado'){
    h += `<div class="proximo"><p>Arquivado — fora do painel.</p>
      <button class="btn sec" onclick="desarquivarOrc()">Trazer de volta ao painel</button></div>`;
    return h;
  }
  h += `<div class="proximo"><p>${titulo}</p>${btn}</div>`;
  if (ANTERIOR[o.Status]) h += `<button class="voltar-etapa" onclick="voltarEtapa()">Voltar uma etapa</button>`;
  return h;
}

function telaEditor(){
  const o = rascunho.orcamento;
  const t = totais();
  const novo = !o.ID;
  cabecalho(novo ? 'Novo orçamento' : (o.Placa || 'Orçamento'), novo ? 'preencha e salve' : `nº ${o.Numero} · ${ROTULO[o.Status]||o.Status}`);

  let h = '<div class="wrap">';
  if (!novo) h += blocoEtapas(o, t);

  // A placa vem primeiro: é o que a pessoa tem na mão olhando o carro, e é o que
  // deixa o app preencher cliente e veículo sozinho quando já passou por aqui.
  h += `<div class="placa-hero">
    <label for="fPlaca">${novo?'Placa do carro':'Placa'}</label>
    <input id="fPlaca" class="placa" value="${esc(o.Placa)}" placeholder="ABC1D23"
           autocomplete="off" aria-describedby="achado">
  </div>
  <div id="achado" aria-live="polite"></div>

  <label for="fCli">Cliente</label>
  <div class="sug"><input id="fCli" value="${esc(o.ClienteNome)}" placeholder="nome do cliente" autocomplete="off"></div>
  <label for="fTel">WhatsApp (com DDD)</label>
  <input id="fTel" class="tel" value="${esc(o.Telefone)}" inputmode="tel" placeholder="(69) 99999-9999">
  <div id="veicChips"></div>

  <details class="mais" ${(o.Modelo||o.Ano||o.Cor)&&!novo?'open':''}>
    <summary>Mais detalhes do carro</summary>
    <label for="fModelo">Veículo</label>
    <input id="fModelo" value="${esc(o.Modelo)}" placeholder="Gol, Onix, Hilux…">
    <div class="grid3">
      <div><label for="fAno">Ano</label><input id="fAno" value="${esc(o.Ano)}" inputmode="numeric" placeholder="2018"></div>
      <div><label for="fCor">Cor</label><input id="fCor" value="${esc(o.Cor)}" placeholder="prata"></div>
      <div><label for="fData">Data</label><input id="fData" type="date" value="${esc(String(o.Data||hoje()).slice(0,10))}"></div>
    </div>
  </details>

  <div class="secao">Serviços</div>`;

  if (!rascunho.itens.length){
    h += `<div class="vazio">Nenhum serviço ainda.<br>Toque abaixo e escolha da lista.</div>`;
  }
  rascunho.itens.forEach((it,ix)=>{
    h += `<div class="item" data-ix="${ix}">
      <div class="desc">
        <b>${esc(it.Descricao||'sem descrição')}</b>
        <button class="del" onclick="removerItem(${ix})" aria-label="Remover ${esc(it.Descricao||'serviço')}">×</button>
      </div>
      <div class="lin">
        <input value="${esc(it.Qtd||1)}" inputmode="numeric" aria-label="Quantidade de ${esc(it.Descricao||'serviço')}"
               oninput="mudarItem(${ix},'Qtd',this.value)">
        <input class="moeda" value="${esc(num(it.Valor)?num(it.Valor).toFixed(2).replace('.',','):'')}" placeholder="0,00"
               aria-label="Valor de ${esc(it.Descricao||'serviço')}">
        <b class="sub">${moeda(num(it.Qtd)*num(it.Valor))}</b>
      </div>
      ${temFoto(it)?(temFotoLocal(it.ID)
        ? `<img class="fotogrande" src="${FOTO_VAZIA}" data-foto-local="${esc(it.ID)}"
             onclick="verFotoLocal('${escJs(it.ID)}')" alt="Foto de ${esc(it.Descricao||'serviço')} guardada neste aparelho">`
        : `<img class="fotogrande" src="${esc(fotoSrc(it.FotoURL))}" data-url="${esc(it.FotoURL)}"
             referrerpolicy="no-referrer" onerror="fotoErro(this)" onclick="fotoAbrir(this.dataset.url)" alt="Foto de ${esc(it.Descricao||'serviço')}">`):''}
      <div class="foto-acoes">
        <button class="fotobtn" onclick="tirarFoto(${ix})">${temFoto(it)?'📷 Trocar foto':'📷 Tirar foto'}</button>
        ${temFotoLocal(it.ID)?`<button class="fotobtn" onclick="salvarFotoNoAparelho('${escJs(it.ID)}','${escJs(it.Descricao||'foto')}')">⬇ Salvar no aparelho</button>`:''}
        ${temFoto(it)?`<button class="fotobtn" onclick="removerFoto(${ix})">Remover foto</button>`:''}
      </div>
    </div>`;
  });
  h += `<button class="btn ${rascunho.itens.length?'sec':''}" onclick="folhaServicos()">
    ${rascunho.itens.length?'Adicionar outro serviço':'＋ Escolher serviços'}</button>`;

  h += `<div class="tot-box">
    <div class="l"><span>Serviços</span><b id="totServ">${moeda(t.total)}</b></div>
    <div class="l"><span>Recebido</span><b id="totPago">${moeda(t.pago)}</b></div>
    <div class="l" id="linhaDesc" style="${t.desconto>0?'':'display:none'}"><span>Desconto</span><b id="totDesc">− ${moeda(t.desconto)}</b></div>
    <div class="big"><span id="totRot">${t.saldo>0?'Falta receber':'Saldo'}</span><b id="totSaldo" class="${t.saldo>0?'saldo-dev':'saldo-ok'}">${moeda(t.saldo)}</b></div>
  </div>

  <label for="fCobrado">Valor cobrado <span style="font-weight:500;text-transform:none">— o preço fechado com o cliente</span></label>
  <input id="fCobrado" class="moeda" value="${esc(t.cobrado?t.cobrado.toFixed(2).replace('.',','):'')}"
         placeholder="${esc(moeda(t.total).replace('R$ ',''))} (a soma dos serviços)">
  <p style="margin:5px 0 0;font-size:12px;color:var(--steel)">
    ${t.cobrado>0
      ? `Os serviços somam ${moeda(t.total)}, mas o cliente paga <b>${moeda(t.cobrado)}</b>.`
      : 'Deixe vazio para cobrar a soma dos serviços. Preencha quando fechar um preço diferente.'}
  </p>`;

  // pagamento
  h += `<div class="secao" id="secPag">Pagamento</div>`;
  if (novo){
    h += `<div class="vazio">Salve o orçamento para poder receber pagamentos.</div>`;
  } else {
    if (rascunho.pagamentos.length){
      const estornados = {};
      rascunho.pagamentos.forEach(p=>{ if (p.EstornoDeID) estornados[p.EstornoDeID]=1; });
      h += '<div class="pgbox">';
      rascunho.pagamentos.forEach((p,ix)=>{
        const estorno = String(p.Estorno)==='true';
        const jaEst = estornados[p.ID];
        h += `<div class="pglin"><div><b${estorno?' style="color:var(--debt)"':''}>${moeda(p.Valor)}</b>
          <small>${FORMA_ROT[p.Forma]||p.Forma} · ${dataBR(p.Data)}${estorno?' · estorno':jaEst?' · estornado':''}${p.LancadoPor?' · '+esc(String(p.LancadoPor).split('@')[0]):''}</small></div>
          ${estorno||jaEst?'<span></span>':`<button class="del" onclick="estornarPag(${ix})" aria-label="Estornar pagamento">↩</button>`}</div>`;
      });
      h += '</div>';
    }
    if (t.total>0 && t.saldo<=0){
      h += `<div class="quitado">✓ Totalmente pago</div>`;
    } else if (pagAberto){
      h += `<div class="pgbox">
        <label for="pgValor" style="margin-top:0">Valor recebido</label>
        <input id="pgValor" class="moeda" value="${esc(String(t.saldo.toFixed(2)).replace('.',','))}">
        <label>Forma</label>
        <div class="formas">${FORMAS.map(f=>`<button class="chip" aria-pressed="${pagForma===f}" onclick="escolherForma('${f}')">${FORMA_ROT[f]}</button>`).join('')}</div>
        <button class="btn tape" onclick="confirmarPag()">Confirmar recebimento</button>
        <button class="btn sec" onclick="pagAberto=false;lerCampos();telaEditor()">Cancelar</button>
      </div>`;
    } else if (t.total>0){
      h += `<button class="btn tape" onclick="abrirPag()">Receber pagamento</button>`;
    }
  }

  h += `<label for="fObs">Observações</label>
  <textarea id="fObs" rows="2" placeholder="prazo, condições, garantia…">${esc(o.Obs)}</textarea>`;

  const fechado = !novo && travadoLocal(o);
  if (fechado){
    h += `<div class="quitado" style="background:#EEF1F4;border-color:var(--line);color:var(--steel)">
      🔒 Pago e fechado. ${ehDono()?'Alterações ficam registradas com motivo.':'Só o dono altera daqui para frente.'}</div>`;
  }
  h += `<button class="btn" onclick="salvar()"${fechado&&!ehDono()?' disabled':''}>${novo?'Salvar orçamento':'Salvar alterações'}</button>`;
  if (!novo){
    h += `<div class="acoes">
      <button class="btn tape" onclick="gerarPDF(true)">Enviar no WhatsApp</button>
      <button class="btn sec" onclick="gerarPDF(false)">Baixar PDF</button>
    </div>`;
    if (ehDono() && num(o.Pago)===0 && o.Status!=='Cancelado'){
      h += `<button class="btn ghost" onclick="cancelarOrc()">Cancelar orçamento</button>`;
    }
    if (o.AlteradoPor){
      h += `<p style="text-align:center;color:var(--steel);font-size:11.5px;margin-top:14px">
        última alteração por ${esc(String(o.AlteradoPor).split('@')[0])}${o.AtualizadoEm?' · '+dataBR(o.AtualizadoEm):''}</p>`;
    }
  }

  tela.innerHTML = h + '</div>';
  ligarMascaras(tela);
  // o campo de valor avisa o modelo depois da máscara, não durante a digitação
  tela.querySelectorAll('.item .moeda').forEach(el=>{
    el._aoMudar = v => mudarItem(+el.closest('.item').dataset.ix, 'Valor', v);
  });
  const cob = $('#fCobrado');
  if (cob) cob._aoMudar = v =>{ rascunho.orcamento.ValorCobrado = num(v); pintarTotais(); guardarRascunho(); };
  ligarPlaca();
  ligarCliente();
  mostrarVeiculos();
  // qualquer digitação no cabeçalho guarda o rascunho, para não perder se fechar o app
  tela.querySelectorAll('#fCli,#fTel,#fModelo,#fAno,#fCor,#fData,#fObs').forEach(el=>{
    el.addEventListener('change', ()=>{ lerCampos(); guardarRascunho(); });
  });
  if (novo && !o.Placa) setTimeout(()=>{ const p = $('#fPlaca'); if (p) p.focus(); }, 60);
  carregarFotosLocaisNaTela();
}

/* --- campos --- */
function lerCampos(){
  const g = i => { const el=$('#'+i); return el ? el.value : undefined; };
  const o = rascunho.orcamento;
  const nomeNovo = g('fCli');
  if (nomeNovo!==undefined && semAcento(nomeNovo.trim())!==semAcento(String(o.ClienteNome||'').trim())) o.ClienteID = '';
  const map = {ClienteNome:'fCli',Telefone:'fTel',Placa:'fPlaca',Data:'fData',Modelo:'fModelo',Ano:'fAno',Cor:'fCor',Obs:'fObs'};
  for (const k in map){ const v = g(map[k]); if (v!==undefined) o[k] = k==='Placa' ? soPlaca(v) : v; }
  const cobr = g('fCobrado');
  if (cobr !== undefined) o.ValorCobrado = num(cobr);
}

/* ===================== rascunho guardado no aparelho ===================== */
// Se o app fechar no meio do preenchimento, o que foi digitado volta.
function guardarRascunho(){
  try{
    // só faz sentido para orçamento que ainda não foi salvo; se guardasse a edição
    // de um já existente, sobrescreveria um rascunho de verdade e não seria retomável
    if (!rascunho || rascunho.orcamento.ID) return;
    localStorage.setItem('rascunho', JSON.stringify({ quando: Date.now(), r: rascunho }));
  }catch(e){}
}
function limparRascunho(){ try{ localStorage.removeItem('rascunho'); }catch(e){} }

function rascunhoGuardado(){
  try{
    const g = JSON.parse(localStorage.getItem('rascunho'));
    if (!g || !g.r || !g.r.orcamento) return null;
    if (Date.now() - g.quando > 7*24*3600*1000) return null;         // mais de uma semana: descarta
    if (g.r.orcamento.ID) return null;                               // já salvo, não é rascunho
    const o = g.r.orcamento;
    const temAlgo = String(o.Placa||'').trim() || String(o.ClienteNome||'').trim() || (g.r.itens||[]).length;
    return temAlgo ? g.r : null;
  }catch(e){ return null; }
}

async function ofereceRascunho(){
  if (document.querySelector('.folha-fundo')) return false;   // não empilha folhas
  const r = rascunhoGuardado();
  if (!r) return false;
  const o = r.orcamento;
  const quem = [o.Placa, o.ClienteNome].filter(Boolean).join(' · ')
    || (r.itens||[]).map(i=>i.Descricao).filter(Boolean).slice(0,2).join(', ')
    || 'sem identificação';
  const seguir = await confirmar('Tem um orçamento não salvo',
    `${quem} — ${(r.itens||[]).length} serviço(s). Quer continuar de onde parou?`, 'Continuar');
  if (!seguir){ limparRascunho(); return false; }
  try{ await migrarFotosLegadas(r.itens); }
  catch(e){ aviso('Não consegui recuperar uma foto antiga deste rascunho', true); }
  rascunho = r;
  telaAtual = 'editor';
  render();
  return true;
}
// Atualiza só o subtotal da linha e a caixa de totais. Redesenhar a tela inteira
// a cada dígito fazia o campo perder o foco e a posição do cursor no celular.
function mudarItem(ix, campo, v){
  if (!rascunho.itens[ix]) return;
  rascunho.itens[ix][campo] = v;
  const it = rascunho.itens[ix];
  const linha = document.querySelector(`.item[data-ix="${ix}"] .sub`);
  if (linha) linha.textContent = moeda(num(it.Qtd) * num(it.Valor));
  pintarTotais();
  guardarRascunho();
}

function pintarTotais(){
  const t = totais();
  const p = (sel, txt)=>{ const el = $(sel); if (el) el.textContent = txt; };
  p('#totServ', moeda(t.total));
  p('#totPago', moeda(t.pago));
  p('#totRot', t.saldo > 0 ? 'Falta receber' : 'Saldo');
  p('#totDesc', '− ' + moeda(t.desconto));
  const ld = $('#linhaDesc');
  if (ld) ld.style.display = t.desconto > 0 ? '' : 'none';
  const s = $('#totSaldo');
  if (s){ s.textContent = moeda(t.saldo); s.className = t.saldo > 0 ? 'saldo-dev' : 'saldo-ok'; }
}

async function removerItem(ix){
  const it = rascunho.itens[ix]; if (!it) return;
  lerCampos();
  if (!(await confirmar('Remover serviço', `"${it.Descricao||'sem descrição'}" sai do orçamento.`, 'Remover', true))) return;
  if (temFotoLocal(it.ID)) await apagarFotoLocal(it.ID).catch(()=>{});
  rascunho.itens.splice(ix,1);
  guardarRascunho();
  telaEditor();
}

/* --- reconhecer o carro pela placa --- */
const soPlaca = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

// Último orçamento daquela placa, para puxar cliente e dados do carro.
function historicoDaPlaca(placa){
  const p = soPlaca(placa);
  if (p.length < 7) return null;
  const iguais = dados.orcamentos
    .filter(o=> soPlaca(o.Placa) === p)
    .sort((a,b)=> String(b.AtualizadoEm||b.Data||'').localeCompare(String(a.AtualizadoEm||a.Data||'')));
  return iguais.length ? iguais[0] : null;
}

function ligarPlaca(){
  const el = $('#fPlaca'); if (!el) return;
  const agir = ()=>{
    const o = rascunho.orcamento;
    o.Placa = soPlaca(el.value);
    const ant = historicoDaPlaca(o.Placa);
    const box = $('#achado');
    if (!ant || String(ant.ID) === String(o.ID)){ if (box) box.innerHTML = ''; return; }

    // só preenche o que está vazio: nunca sobrescreve o que a pessoa digitou
    const por = (campo, campoEl)=>{
      if (String(o[campo]||'').trim()) return;
      if (!ant[campo]) return;
      o[campo] = ant[campo];
      const c = $('#'+campoEl); if (c) c.value = ant[campo];
    };
    por('ClienteNome','fCli'); por('Telefone','fTel');
    por('Modelo','fModelo'); por('Ano','fAno'); por('Cor','fCor');
    if (!o.ClienteID && ant.ClienteID) o.ClienteID = ant.ClienteID;

    if (box){
      const desc = [ant.Modelo, ant.Cor, ant.Ano].filter(Boolean).join(' · ');
      box.innerHTML = `<div class="achado">✓<div>Já atendido aqui${desc?': <b>'+esc(desc)+'</b>':''}
        ${ant.ClienteNome?'<br>Cliente: <b>'+esc(ant.ClienteNome)+'</b>':''}</div></div>`;
    }
    guardarRascunho();
  };
  el.addEventListener('input', agir);
  el.addEventListener('blur', agir);
  if (el.value) agir();
}

/* --- serviço só da lista --- */
const servicosAtivos = () => dados.servicos.filter(s=> String(s.Ativo)!=='false');

function filtrarServicos(termo){
  const t = semAcento(termo.trim());
  let l = servicosAtivos();
  if (t){
    const comeca = l.filter(s=> semAcento(s.Descricao).startsWith(t));
    const contem = l.filter(s=> !semAcento(s.Descricao).startsWith(t) && semAcento(s.Descricao).includes(t));
    l = comeca.concat(contem);
  } else l.sort((a,b)=> String(a.Descricao).localeCompare(String(b.Descricao)));
  return l.slice(0,10);
}

function fecharSug(){ document.querySelectorAll('.sugbox').forEach(b=>b.remove()); }
document.addEventListener('click', e=>{ if (!e.target.closest('.sug')) fecharSug(); });

/* --- escolher serviço no toque --- */
let servCat = 'Todas';
let servBusca = '';

// Abre a lista de serviços numa folha. Cada toque já põe o item no orçamento;
// dá para pôr vários seguidos sem fechar.
async function folhaServicos(){
  lerCampos();
  servCat = 'Todas'; servBusca = '';
  const antes = JSON.stringify(rascunho.itens);
  const escolha = await folha({
    titulo: 'Adicionar serviço',
    corpo: `<input id="svBusca" class="busca" placeholder="buscar serviço" autocomplete="off" style="margin-bottom:10px">
      <div class="cats" id="svCats"></div>
      <div class="grade" id="svGrade"></div>
      <div class="contador" id="svRodape"></div>`,
    botoes: [
      { rot:'Pronto', valor:true },
      { rot:'Cancelar alterações', valor:false, classe:'sec' }
    ],
    aoAbrir: el =>{
      const busca = el.querySelector('#svBusca');
      busca.oninput = ()=>{ servBusca = busca.value; pintarServicos(el); };
      pintarServicos(el);
    }
  });
  if (escolha !== true){
    rascunho.itens = JSON.parse(antes);
    aviso('Alterações nos serviços canceladas');
  } else if (JSON.stringify(rascunho.itens) !== antes){
    const atuais = new Set(rascunho.itens.map(i=>String(i.ID)));
    for (const antigo of JSON.parse(antes)){
      if (!atuais.has(String(antigo.ID)) && temFotoLocal(antigo.ID)) await apagarFotoLocal(antigo.ID).catch(()=>{});
    }
    guardarRascunho();
    aviso('Serviços do orçamento atualizados');
  }
  telaEditor();
}

function listaParaGrade(){
  const t = semAcento(servBusca.trim());
  let l = servicosAtivos().filter(s=> servCat === 'Todas' || String(s.Categoria||'Outros') === servCat);
  if (t) l = l.filter(s=> semAcento(s.Descricao).includes(t));
  return l.sort((a,b)=> String(a.Descricao).localeCompare(String(b.Descricao)));
}

function pintarServicos(el){
  const cats = ['Todas', ...new Set(servicosAtivos().map(s=> String(s.Categoria||'Outros')))];
  el.querySelector('#svCats').innerHTML = cats.map(c=>
    `<button class="chip" aria-pressed="${servCat===c}" data-cat="${escJs(c)}">${esc(c)}</button>`).join('');
  el.querySelectorAll('#svCats .chip').forEach(b=> b.onclick = ()=>{
    servCat = b.dataset.cat; pintarServicos(el);
  });

  const lista = listaParaGrade();
  const postos = {};
  rascunho.itens.forEach(i=>{
    if (i.Descricao) postos[semAcento(i.Descricao)] = (postos[semAcento(i.Descricao)]||0) + (num(i.Qtd)||1);
  });

  el.querySelector('#svGrade').innerHTML = lista.length
    ? lista.map((s,k)=>{
        const n = postos[semAcento(s.Descricao)] || 0;
        return `<button class="svc ${n?'posto':''}" data-k="${k}" aria-pressed="${!!n}">
          <b>${esc(s.Descricao)}</b><span>${n?'incluído · toque para remover':'toque para incluir'} · ${moeda(s.ValorPadrao)}</span></button>`;
      }).join('')
    : `<div class="vazio" style="grid-column:1/3">Nenhum serviço com esse nome.</div>`;

  el.querySelectorAll('#svGrade .svc').forEach(b=> b.onclick = ()=>{
    porServico(lista[+b.dataset.k]);
    pintarServicos(el);
  });

  const t = rascunho.itens.reduce((s,i)=> s + num(i.Qtd)*num(i.Valor), 0);
  el.querySelector('#svRodape').innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px">
      <span style="color:var(--steel)">${rascunho.itens.length} no orçamento</span><b>${moeda(t)}</b></div>
    <button class="btn sec" id="svNovo" style="margin-top:8px">＋ Cadastrar serviço que não está na lista</button>`;
  el.querySelector('#svNovo').onclick = ()=> cadastrarEUsar(el);
}

// Um toque inclui; outro toque remove. Quantidade é ajustada no orçamento,
// evitando que um toque repetido aumente o valor sem uma forma clara de voltar.
function porServico(s){
  if (!s) return;
  const ix = rascunho.itens.findIndex(i=> semAcento(i.Descricao) === semAcento(s.Descricao));
  if (ix >= 0) rascunho.itens.splice(ix, 1);
  else rascunho.itens.push({ ID:id('I'), Descricao:s.Descricao, Qtd:1, Valor:s.ValorPadrao, FotoURL:'' });
}

async function cadastrarEUsar(el){
  const r = await formServico({ Descricao: servBusca.trim(), Categoria:'Funilaria', ValorPadrao:'' });
  if (!r) return;
  try{
    const s = await chamar('salvarServico', { servico:{ ID:'', Descricao:r.Descricao, Categoria:r.Categoria, ValorPadrao:r.ValorPadrao } });
    dados.servicos.push(s); salvarCache();
    porServico(s);
    aviso('Serviço cadastrado e incluído');
  }catch(e){ await tratar(e); }
  if (document.body.contains(el)) pintarServicos(el);
}

function ligarCliente(){
  const el = $('#fCli'); if (!el) return;
  el.oninput = el.onfocus = ()=>{
    fecharSug();
    const termo = semAcento(el.value.trim());
    const lista = dados.clientes.filter(c=> !termo || semAcento(c.Nome).includes(termo)).slice(0,6);
    if (!lista.length) return;
    const box = document.createElement('div');
    box.className='sugbox';
    box.innerHTML = lista.map((c,k)=>`<button type="button" data-k="${k}"><b>${esc(c.Nome)}</b><span>${esc(c.Telefone)}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b=>{
      b.addEventListener('pointerdown', ev=> ev.preventDefault());

        el.value=c.Nome; $('#fTel').value=c.Telefone; fecharSug();
